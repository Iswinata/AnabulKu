<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCECE3" />
  <title>Riwayat Booking — AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh;
      font-family: "Poppins", system-ui, sans-serif;
      background: #e7dbd0;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; justify-content: center; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .app {
      width: 100%; max-width: 393px;
      height: 100dvh;
      background: #fcece3;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 40px -10px rgba(0,0,0,.18);
    }

    /* Topbar — sama persis dengan home.html */
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 26px 22px 12px;
      background: #fcece3;
    }
    .user { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .avatar {
      flex: none;
      width: 40px; height: 40px;
      border-radius: 9999px;
      border: 1px solid #e5e7eb;
      background: linear-gradient(135deg, #ffb066 0%, #f97316 100%);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .user-text { display: flex; flex-direction: column; min-width: 0; }
    .welcome { font-size: 12px; font-weight: 400; color: #6b7280; }
    .username {
      font-size: 14px; font-weight: 700; color: #2c3e50;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .page-label {
      font-size: 11px; font-weight: 600; color: #9CA3AF;
      margin-bottom: 1px;
    }
    .page-title {
      font-size: 15px; font-weight: 800; color: #1F2937;
      letter-spacing: -.2px;
    }
    .btn-back {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
      box-shadow: 0px 1px 2px rgba(0,0,0,.05);
      color: #4b5563;
      flex-shrink: 0;
      transition: transform .12s;
    }
    .btn-back svg { width: 20px; height: 20px; }
    .btn-back:active { transform: scale(.94); }

    /* Filter tabs — horizontal scroll */
    .filter-bar {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 0 20px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: #6B7280;
      transition: all .12s;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: #FF9800;
      border-color: #FF9800;
      color: #fff;
      box-shadow: 1px 1px 0 #000;
    }

    /* Scroll body */
    .scroll-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Booking card */
    .booking-card {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid #E5E7EB;
      box-shadow: 2px 2px 0 #000;
      overflow: hidden;
    }

    /* Card header — warna sesuai status */
    .booking-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: linear-gradient(90deg, #FF9800 0%, #FFD28F 100%);
    }
    .booking-card-header.status-menunggu      { background: linear-gradient(90deg,#f59e0b,#fcd34d); }
    .booking-card-header.status-dikonfirmasi  { background: linear-gradient(90deg,#10b981,#6ee7b7); }
    .booking-card-header.status-selesai       { background: linear-gradient(90deg,#6366f1,#a5b4fc); }
    .booking-card-header.status-dibatalkan    { background: linear-gradient(90deg,#ef4444,#fca5a5); }
    .booking-card-header.status-pending-pay   { background: linear-gradient(90deg,#FF9800,#FFD28F); }

    .booking-klinik {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }
    .booking-status-badge {
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: rgba(0,0,0,.18);
      border-radius: 20px;
      padding: 3px 9px;
      white-space: nowrap;
    }

    /* Card body */
    .booking-card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .booking-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #374151;
    }
    .booking-row-icon {
      font-size: 14px;
      flex-shrink: 0;
      width: 20px;
      text-align: center;
    }
    .booking-row-label {
      color: #9CA3AF;
      font-size: 11px;
      min-width: 60px;
    }
    .booking-row-val {
      font-weight: 600;
      color: #1F2937;
      font-size: 12px;
    }

    /* Card footer */
    .booking-card-footer {
      padding: 10px 14px;
      border-top: 1px solid #F3F4F6;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-lanjutkan {
      padding: 8px 16px;
      background: linear-gradient(180deg,#ff9800,#ffbc59);
      border: none;
      border-radius: 8px;
      box-shadow: 1px 1px 0 #000;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-lanjutkan:active { transform: translate(1px,1px); box-shadow: none; }
    .btn-batalkan {
      padding: 8px 16px;
      background: #fff;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      color: #EF4444;
      font-size: 12px;
      font-weight: 600;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 48px 20px;
      text-align: center;
      color: #9CA3AF;
    }
    .empty-state-emoji { font-size: 48px; }
    .empty-state-title { font-size: 15px; font-weight: 700; color: #374151; }
    .empty-state-sub   { font-size: 13px; line-height: 1.6; }
    .btn-cari-klinik {
      margin-top: 4px;
      padding: 11px 24px;
      background: linear-gradient(180deg,#ff9800,#ffbc59);
      border: none;
      border-radius: 10px;
      box-shadow: 2px 2px 0 #000;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    /* Bottom nav */
    .bottomnav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;
      z-index: 50;
      width: min(100% - 32px, 361px);
      height: 64px;
      background: #fff;
      border: 2px solid #000;
      box-shadow: 2px 2px 0 #000;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
    }
    .nav-btn {
      flex: 1;
      height: 54px;
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 14px;
      transition: transform .1s;
    }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn:active { transform: scale(.9); }
    .nav-label {
      font-size: 9.5px;
      font-weight: 600;
      color: #9CA3AF;
      line-height: 1;
    }
    .nav-btn.active .nav-label { color: #F97316; }
  </style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="user">
      <span class="avatar" aria-hidden="true" id="userAvatar"></span>
      <span class="user-text">
        <span class="welcome">Riwayat</span>
        <span class="username" id="userGreeting"></span>
      </span>
    </div>
    <div class="actions" style="display:flex;gap:8px;flex:none;">
      <button class="btn-back" type="button" aria-label="Kembali" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Filter tabs -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" type="button" data-filter="semua">Semua</button>
    <button class="filter-btn" type="button" data-filter="pending">Belum Selesai</button>
    <button class="filter-btn" type="button" data-filter="dikonfirmasi">Dikonfirmasi</button>
    <button class="filter-btn" type="button" data-filter="selesai">Selesai</button>
    <button class="filter-btn" type="button" data-filter="dibatalkan">Dibatalkan</button>
  </div>

  <!-- List -->
  <div class="scroll-body" id="bookingList">
    <!-- injected by JS -->
  </div>

  <!-- Bottom nav -->
  <nav class="bottomnav" aria-label="Navigasi utama">
    <button class="nav-btn" type="button" aria-label="Beranda" onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3 2.4 11.1a1 1 0 0 0 .65 1.76H4.5V20a1 1 0 0 0 1 1H9.5v-5.5h5V21H18.5a1 1 0 0 0 1-1v-7.14h1.45a1 1 0 0 0 .65-1.76L12 3z"/>
      </svg>
      <span class="nav-label">Beranda</span>
    </button>
    <button class="nav-btn active" type="button" aria-label="Riwayat Booking" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 8v4l3 3"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span class="nav-label">Riwayat</span>
    </button>
    <button class="nav-btn" type="button" aria-label="Favorit">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
      </svg>
      <span class="nav-label">Favorit</span>
    </button>
    <button class="nav-btn" type="button" aria-label="Profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M5 20a7 7 0 0 1 14 0"/>
      </svg>
      <span class="nav-label">Profil</span>
    </button>
  </nav>

</div>

<script>
(function () {
  "use strict";

  /* ── Auth guard + isi avatar ── */
  var session = {};
  try { session = JSON.parse(localStorage.getItem("anabulku_user_session")) || {}; } catch (e) {}
  if (!session.loggedIn) { window.location.replace("login.html"); return; }

  var username = session.username || session.nama || "Pengguna";
  var inisial = username.slice(0, 2).toUpperCase();
  var avatarEl = document.getElementById("userAvatar");
  var greetingEl = document.getElementById("userGreeting");
  if (avatarEl) avatarEl.textContent = inisial;
  if (greetingEl) greetingEl.textContent = username;

  /* ── Load bookings milik user ini + pending yang belum masuk list ── */
  function loadAll() {
    var bookings = [];
    try { bookings = JSON.parse(localStorage.getItem("anabulku_bookings")) || []; } catch (e) {}

    /* Sertakan pending payment jika belum ada di list */
    var pending = null;
    try { pending = JSON.parse(localStorage.getItem("anabulku_pending_payment")); } catch (e) {}
    if (pending && pending.id) {
      var alreadyIn = bookings.some(function(b) { return b.id === pending.id; });
      if (!alreadyIn) {
        /* Masukkan sementara ke list dengan status khusus */
        pending._isPending = true;
        bookings = [pending].concat(bookings);
      }
    }

    /* Filter hanya booking milik user yang login (berdasarkan email sesi atau sumber app_user) */
    /* Karena booking user tidak menyimpan email, tampilkan semua booking sumber app_user */
    return bookings.filter(function(b) {
      return b.sumber === "app_user" || b._isPending;
    });
  }

  /* ── Format tanggal ── */
  function fmtTanggal(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00");
    return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  /* ── Status label & kelas ── */
  function statusInfo(b) {
    if (b._isPending) return { label: "Menunggu Pembayaran", cls: "status-pending-pay" };
    var s = (b.status || "").toLowerCase();
    if (s === "menunggu")     return { label: "Menunggu Konfirmasi", cls: "status-menunggu" };
    if (s === "dikonfirmasi") return { label: "Dikonfirmasi", cls: "status-dikonfirmasi" };
    if (s === "selesai")      return { label: "Selesai", cls: "status-selesai" };
    if (s === "dibatalkan")   return { label: "Dibatalkan", cls: "status-dibatalkan" };
    return { label: s || "—", cls: "status-menunggu" };
  }

  /* ── Apakah booking "belum selesai" (pending filter) ── */
  function isPending(b) {
    if (b._isPending) return true;
    var s = (b.status || "").toLowerCase();
    return s === "menunggu" || s === "dikonfirmasi";
  }

  /* ── Render ── */
  var currentFilter = "semua";
  var allBookings = [];

  function render() {
    allBookings = loadAll();
    var list = document.getElementById("bookingList");
    if (!list) return;

    var filtered = allBookings.filter(function(b) {
      if (currentFilter === "semua")       return true;
      if (currentFilter === "pending")     return isPending(b);
      if (currentFilter === "dikonfirmasi") return (b.status || "").toLowerCase() === "dikonfirmasi";
      if (currentFilter === "selesai")     return (b.status || "").toLowerCase() === "selesai";
      if (currentFilter === "dibatalkan")  return (b.status || "").toLowerCase() === "dibatalkan";
      return true;
    });

    if (!filtered.length) {
      list.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-emoji">📋</div>' +
          '<p class="empty-state-title">Belum ada booking</p>' +
          '<p class="empty-state-sub">Kamu belum memiliki riwayat booking.<br>Yuk cari klinik dan buat janji sekarang!</p>' +
          '<button class="btn-cari-klinik" onclick="location.href=\'home.html\'">Cari Klinik</button>' +
        '</div>';
      return;
    }

    list.innerHTML = filtered.map(function(b, i) {
      var si = statusInfo(b);
      var ref = b.id ? "ANB-" + b.id.slice(-6).toUpperCase() : "—";

      var footer = "";
      /* Tombol aksi untuk booking pending payment */
      if (b._isPending) {
        footer =
          '<div class="booking-card-footer">' +
            '<button class="btn-batalkan" type="button" data-id="' + (b.id || "") + '" data-action="cancel-pending">Batalkan</button>' +
            '<button class="btn-lanjutkan" type="button" data-action="lanjutkan">Lanjutkan Bayar</button>' +
          '</div>';
      }
      /* Tombol batalkan untuk booking menunggu konfirmasi */
      else if ((b.status || "").toLowerCase() === "menunggu") {
        footer =
          '<div class="booking-card-footer">' +
            '<button class="btn-batalkan" type="button" data-id="' + (b.id || "") + '" data-action="cancel">Batalkan</button>' +
          '</div>';
      }

      return '' +
        '<div class="booking-card">' +
          '<div class="booking-card-header ' + si.cls + '">' +
            '<span class="booking-klinik">' + esc(b.namaKlinik || "Klinik") + '</span>' +
            '<span class="booking-status-badge">' + esc(si.label) + '</span>' +
          '</div>' +
          '<div class="booking-card-body">' +
            '<div class="booking-row">' +
              '<span class="booking-row-icon">👨‍⚕️</span>' +
              '<span class="booking-row-label">Dokter</span>' +
              '<span class="booking-row-val">' + esc(b.dokter || "—") + '</span>' +
            '</div>' +
            '<div class="booking-row">' +
              '<span class="booking-row-icon">📅</span>' +
              '<span class="booking-row-label">Tanggal</span>' +
              '<span class="booking-row-val">' + esc(fmtTanggal(b.tanggal)) + (b.jam ? ' · ' + esc(b.jam) : '') + '</span>' +
            '</div>' +
            '<div class="booking-row">' +
              '<span class="booking-row-icon">🐾</span>' +
              '<span class="booking-row-label">Hewan</span>' +
              '<span class="booking-row-val">' + esc(b.namaHewan || "—") + ' (' + esc(b.jenisHewan || "—") + ')</span>' +
            '</div>' +
            '<div class="booking-row">' +
              '<span class="booking-row-icon">🔖</span>' +
              '<span class="booking-row-label">Kode</span>' +
              '<span class="booking-row-val" style="font-size:11px;color:#9CA3AF;">' + ref + '</span>' +
            '</div>' +
          '</div>' +
          footer +
        '</div>';
    }).join("");

    /* Wire action buttons */
    list.querySelectorAll("[data-action='lanjutkan']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        window.location.href = "payment.html";
      });
    });

    list.querySelectorAll("[data-action='cancel-pending']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (!confirm("Batalkan booking ini?")) return;
        try { localStorage.removeItem("anabulku_pending_payment"); } catch (e) {}
        render();
      });
    });

    list.querySelectorAll("[data-action='cancel']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        if (!confirm("Batalkan booking ini?")) return;
        try {
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var idx = bks.findIndex(function(b) { return b.id === id; });
          if (idx >= 0) { bks[idx].status = "dibatalkan"; }
          localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        } catch (e) {}
        render();
      });
    });
  }

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  /* ── Filter bar ── */
  document.getElementById("filterBar").addEventListener("click", function(e) {
    var btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentFilter = btn.getAttribute("data-filter");
    render();
  });

  render();
})();
</script>
</body>
</html>
