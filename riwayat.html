<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>Riwayat Booking — AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: "Poppins", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      color: #fff;
    }
    body { display: flex; justify-content: center; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; background: none; color: inherit; }

    .app {
      position: relative; width: 100%; max-width: 393px; min-height: 100dvh;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255,255,255,0.18); border-right: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,0.26);
      display: flex; flex-direction: column; padding: 0;
    }

    .header {
      padding: 20px 22px 14px; flex-shrink: 0;
    }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      display: grid; place-items: center; width: 40px; height: 40px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.75); flex-shrink: 0; transition: background .12s, transform .12s;
    }
    .btn-back:active { transform: scale(.94); }
    .btn-back svg { width: 20px; height: 20px; }
    .btn-back svg path, .btn-back svg polyline { stroke: rgba(255,255,255,0.75); }

    .header-text { min-width: 0; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.45); font-weight: 400; line-height: 1.4; margin-top: 1px; }

    .filter-wrap {
      padding: 8px 0 0; flex-shrink: 0;
    }
    .filter-bar { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.60);
      transition: all .15s; white-space: nowrap; line-height: 1; cursor: pointer;
    }
    .filter-chip.active {
      background: rgba(255,152,0,0.25); border-color: rgba(255,152,0,0.6);
      color: #ffbd5d; box-shadow: 0 0 0 2px rgba(255,152,0,0.2);
    }

    .content { flex: 1; overflow-y: auto;
      padding: 4px 16px 100px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .day-group { margin-top: 18px; }

    .day-label {
      font-size: 11px; font-weight: 700;
      color: #ffbd5d;
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 8px; padding-left: 2px;
    }

    .booking-card {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }

    .card-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .card-clinic-thumb {
      width: 44px; height: 44px; border-radius: 10px;
      object-fit: cover; flex-shrink: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .card-clinic-info { flex: 1; min-width: 0; }
    .card-clinic-name {
      font-size: 13px; font-weight: 700; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-clinic-addr {
      font-size: 11px; color: rgba(255,255,255,0.50);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
    }

    .card-status {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 700;
      padding: 4px 10px; border-radius: 20px;
      flex-shrink: 0;
    }
    .card-status--confirmed { background: rgba(34,197,94,0.18); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .card-status--pending   { background: rgba(255,152,0,0.18);  color: #ffbd5d; border: 1px solid rgba(255,152,0,0.35); }
    .card-status--cancelled { background: rgba(239,68,68,0.15);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .card-status--done      { background: rgba(99,102,241,0.18); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }

    .card-body { padding: 10px 14px; }

    .card-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .card-row:last-child { border-bottom: none; }
    .card-row svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .55; }
    .card-row-label { font-size: 11px; color: rgba(255,255,255,0.45); min-width: 80px; }
    .card-row-val { font-size: 12px; font-weight: 600; color: #fff; }
    .card-row-val--total { color: #ffbd5d; }

    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .card-foot--confirmed {
      background: rgba(34,197,94,0.08);
      border-top-color: rgba(34,197,94,0.15);
    }
    .card-foot-info { font-size: 12px; color: rgba(255,255,255,0.55); }
    .card-foot-info b { color: #fff; font-weight: 700; }

    .foot-confirmed-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(34,197,94,0.25);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .foot-confirmed-icon svg { width: 14px; height: 14px; color: #4ade80; }
    .foot-confirmed-badge { font-size: 12px; font-weight: 700; color: #4ade80; }
    .foot-confirmed-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }

    .btn-cek {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 10px;
      background: linear-gradient(135deg, #ff9800 0%, #ffbd5d 100%);
      color: #fff; font-size: 12px; font-weight: 700;
      font-family: inherit; cursor: pointer; border: none;
      box-shadow: 0 3px 10px rgba(255,152,0,0.3);
      transition: transform .1s, opacity .1s;
    }
    .btn-cek:active { transform: scale(.97); opacity: .9; }
    .btn-cek svg { width: 13px; height: 13px; }

    .pending-info-bar {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 8px 14px; background: rgba(255,152,0,0.10);
      border-top: 1px solid rgba(255,152,0,0.20);
      font-size: 11px; color: rgba(255,255,255,0.65);
      line-height: 1.45;
    }
    .pending-info-bar.urgent { background: rgba(239,68,68,0.12); border-top-color: rgba(239,68,68,0.3); color: #fca5a5; }
    .pending-info-bar svg { flex-shrink: 0; margin-top: 1px; }

    .timer-pill {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px;
      background: rgba(255,152,0,0.20); color: #ffbd5d;
      font-size: 10.5px; font-weight: 700;
      border: 1px solid rgba(255,152,0,0.35);
    }
    .timer-pill.urgent { background: rgba(239,68,68,0.18); color: #fca5a5; border-color: rgba(239,68,68,0.35); }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; padding: 56px 24px; text-align: center;
    }
    .empty-state-icon { font-size: 44px; }
    .empty-state-title { font-size: 15px; font-weight: 700; color: #fff; }
    .empty-state-sub { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.5; }

    @media (prefers-reduced-motion:reduce) { *{transition:none!important;animation:none!important;} }
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .content::-webkit-scrollbar { width: 0; }

    .booking-card {
      background: rgba(255,255,255,0.10);
      border-radius: 18px; border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      overflow: hidden; cursor: default;
      user-select: none; -webkit-user-select: none; pointer-events: none;
    }
    .booking-card .btn-cek { pointer-events: auto; }

    .card-accent { height: 3px; }
    .card-accent.s-menunggu     { background: linear-gradient(90deg,#F59E0B,#FCD34D); }
    .card-accent.s-dikonfirmasi { background: linear-gradient(90deg,#10B981,#34D399); }
    .card-accent.s-selesai      { background: linear-gradient(90deg,#6366F1,#818CF8); }
    .card-accent.s-dibatalkan   { background: linear-gradient(90deg,#EF4444,#F87171); }
    .card-accent.s-pending      { background: linear-gradient(90deg,#F97316,#FDBA74); }

    .card-head { padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
    .card-avatar {
      flex-shrink: 0; width: 42px; height: 42px;
      border-radius: 12px; display: grid; place-items: center; font-size: 18px;
    }
    .card-avatar.s-menunggu     { background: rgba(245,158,11,0.20); }
    .card-avatar.s-dikonfirmasi { background: rgba(16,185,129,0.20); }
    .card-avatar.s-selesai      { background: rgba(99,102,241,0.20); }
    .card-avatar.s-dibatalkan   { background: rgba(239,68,68,0.18); }
    .card-avatar.s-pending      { background: rgba(249,115,22,0.20); }
    .card-head-text { flex: 1; min-width: 0; }
    .card-klinik { font-size: 14px; font-weight: 800; color: #fff; word-break: break-word; }
    .card-ref { font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.45); margin-top: 1px; font-family: monospace; }
    .status-pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; align-self: flex-start;
    }
    .status-pill-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .status-pill.s-menunggu     { background: rgba(245,158,11,0.20); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
    .status-pill.s-dikonfirmasi { background: rgba(16,185,129,0.18); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
    .status-pill.s-selesai      { background: rgba(99,102,241,0.18); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.35); }
    .status-pill.s-dibatalkan   { background: rgba(239,68,68,0.18);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.30); }
    .status-pill.s-pending      { background: rgba(249,115,22,0.18); color: #fdba74; border: 1px solid rgba(249,115,22,0.35); }
    .status-pill.s-menunggu     .status-pill-dot { background: #F59E0B; }
    .status-pill.s-dikonfirmasi .status-pill-dot { background: #10B981; }
    .status-pill.s-selesai      .status-pill-dot { background: #6366F1; }
    .status-pill.s-dibatalkan   .status-pill-dot { background: #EF4444; }
    .status-pill.s-pending      .status-pill-dot { background: #F97316; }

    .card-body {
      padding: 0 16px 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px;
    }
    .card-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .card-field.full { grid-column: 1/-1; }
    .card-field-label { font-size: 9.5px; font-weight: 600; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .4px; }
    .card-field-val { font-size: 12.5px; font-weight: 700; color: #fff; word-break: break-word; white-space: normal; }
    .card-field-val.harga { color: #ffbd5d; font-size: 13px; font-weight: 800; }
    .card-field-val.timer-val { display: flex; align-items: center; overflow: visible; }
    .card-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 0 16px; }

    .card-foot { padding: 10px 14px 12px; display: flex; gap: 8px; align-items: center; }
    .card-foot-info { flex: 1; min-width: 0; font-size: 11px; color: rgba(255,255,255,0.50); line-height: 1.4; }
    .card-foot-info b { display: block; font-size: 12px; color: #fff; font-weight: 700; }
    .btn-cek {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 10px 14px; border-radius: 12px;
      background: linear-gradient(135deg,#ff9800,#ffbd5d);
      color: #fff; font-size: 12px; font-weight: 700;
      border: none; box-shadow: 0 4px 14px rgba(255,152,0,0.35);
      transition: transform .1s, opacity .1s; flex-shrink: 0; white-space: nowrap;
    }
    .btn-cek:active { transform: scale(.97); opacity: .9; }
    .btn-cek svg { width: 14px; height: 14px; }

    .card-timer {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; color: #fcd34d;
      background: rgba(245,158,11,0.20); border: 1px solid rgba(245,158,11,0.40);
      border-radius: 20px; padding: 2px 8px;
    }
    .card-timer.urgent { color: #fca5a5; background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.35); }

    .pending-info-bar {
      margin: 0 14px 12px; padding: 8px 12px;
      background: rgba(255,152,0,0.12); border: 1px solid rgba(255,152,0,0.28);
      border-radius: 10px; display: flex; align-items: flex-start;
      gap: 7px; font-size: 11px; color: rgba(255,255,255,0.70); line-height: 1.45;
    }
    .pending-info-bar svg { flex-shrink: 0; margin-top: 1px; }
    .pending-info-bar.urgent { background: rgba(239,68,68,0.14); border-color: rgba(239,68,68,0.30); color: #fca5a5; }

    .card-foot--confirmed {
      background: rgba(16,185,129,0.10); border-top: 1px solid rgba(16,185,129,0.20);
      padding: 10px 16px 12px; display: flex; align-items: center; gap: 10px;
    }
    .foot-confirmed-icon {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(16,185,129,0.20); display: grid; place-items: center; flex-shrink: 0;
    }
    .foot-confirmed-icon svg { width: 16px; height: 16px; color: #4ade80; }
    .foot-confirmed-badge { font-size: 12.5px; font-weight: 800; color: #4ade80; line-height: 1.3; }
    .foot-confirmed-sub { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.4; }

    .foot-waiting-label {
      font-size: 11px; font-weight: 600; color: #fcd34d;
      display: flex; align-items: center; gap: 6px;
    }
    .foot-waiting-label svg { width: 14px; height: 14px; flex-shrink: 0; }

    .empty {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 60px 24px 40px; gap: 10px;
    }
    .empty-illo {
      width: 80px; height: 80px; border-radius: 0; background: none;
      display: grid; place-items: center; font-size: 52px; margin-bottom: 6px; box-shadow: none;
    }
    .empty-title { font-size: 17px; font-weight: 700; color: #fff; }
    .empty-sub   { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; }
    .btn-explore {
      margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 22px; border-radius: 12px;
      background: linear-gradient(135deg, #ff9800, #ffbd5d);
      color: #fff; font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 14px rgba(255,152,0,0.35);
      transition: transform .1s, opacity .1s;
    }
    .btn-explore:active { transform: scale(.97); opacity: .92; }

    /* ══ Payment Overlay — transparent glassmorphism ══ */
    .pay-overlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .pay-overlay.open { display: flex; animation: pmFadeIn .22s ease forwards; }
    @keyframes pmFadeIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }

    .pay-card {
      width: 100%; max-width: 320px;
      background: rgba(15,13,40,0.88);
      backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10);
      overflow: hidden;
    }

    /* top bar */
    .pay-card-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 13px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
    }
    .pay-card-title { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.90); letter-spacing: .01em; }
    .pay-card-close {
      width: 26px; height: 26px; border-radius: 7px;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16);
      display: grid; place-items: center; color: rgba(255,255,255,0.65);
      transition: background .15s;
    }
    .pay-card-close:active { background: rgba(255,255,255,0.22); }
    .pay-card-close svg { width: 12px; height: 12px; }

    /* body */
    .pay-card-body {
      padding: 20px 18px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    /* QRIS frame */
    .pc-qris-frame {
      width: 210px; height: 210px;
      background: #fff; border-radius: 18px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.30), 0 0 48px rgba(255,152,0,0.15);
      display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
      position: relative;
    }
    .pc-qris-frame img { width: 190px; height: 190px; object-fit: contain; display: block; }

    /* download btn di atas frame */
    .pc-qris-dl {
      position: absolute; bottom: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(255,152,0,0.90); border: none;
      display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform .12s, background .15s;
    }
    .pc-qris-dl:active { transform: scale(.92); background: #e65100; }
    .pc-qris-dl svg { width: 14px; height: 14px; color: #fff; }

    /* download row bawah frame */
    .pc-dl-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: rgba(255,255,255,0.50);
    }
    .pc-dl-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: #ffbd5d;
      background: rgba(255,152,0,0.12); border: 1px solid rgba(255,152,0,0.30);
      border-radius: 8px; padding: 5px 12px; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .pc-dl-btn svg { width: 11px; height: 11px; flex-shrink: 0; }
    .pc-dl-btn:active { transform: scale(.96); background: rgba(255,152,0,0.22); }

    .pc-qris-amount {
      font-size: 19px; font-weight: 800; color: #fff;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; padding: 6px 20px;
      letter-spacing: .01em;
    }

    /* Badge status */
    .pc-badge {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 99px; border: 1px solid; align-self: center;
    }
    .pc-badge.menunggu { background: rgba(251,191,36,0.15); color: #fcd34d; border-color: rgba(251,191,36,0.35); }
    .pc-badge.lunas    { background: rgba(34,197,94,0.15);  color: #4ade80; border-color: rgba(34,197,94,0.35); }
    .pc-badge.belum    { background: rgba(239,68,68,0.15);  color: #fca5a5; border-color: rgba(239,68,68,0.35); }

    /* cash / non-QRIS info rows */
    .pc-info-row {
      width: 100%; display: flex; align-items: flex-start; gap: 10px;
      font-size: 12px; color: rgba(255,255,255,0.72); line-height: 1.5;
      padding: 9px 12px;
      background: rgba(255,255,255,0.07); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .pc-info-ico { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    /* summary rows */
    .pc-summary { width: 100%; display: flex; flex-direction: column; gap: 7px; }
    .pc-sum-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 11.5px; gap: 8px;
    }
    }
    .pc-sum-row span:first-child { color: rgba(255,255,255,0.45); }
    .pc-sum-row span:last-child  { font-weight: 600; color: #fff; text-align: right; }
    .pc-sum-row.total { padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.12); margin-top: 2px; }

    /* divider */

    /* close btn */

    /* no-metode state */

    .pc-no-metode-ico { font-size: 40px; }

    .pc-no-metode-sub { font-size: 11.5px; color: rgba(255,255,255,0.45); line-height: 1.6; }
    .pm-no-metode-btn { width: 100%; padding: 12px; border-radius: 10px; background: linear-gradient(135deg,#ff9800,#ffbd5d); color: #fff; font-size: 13px; font-weight: 700; border: none; box-shadow: 0 4px 14px rgba(255,152,0,0.30); cursor: pointer; font-family: inherit; transition: transform .1s, opacity .1s; }

    /* ── QRIS Hero ── */
    .pm-qris-hero {

    .pm-qris-brand-bar {

    .pm-qris-status-pill {

    .pm-qris-corner.bl { bottom: 7px; left: 7px;  border-bottom-width: 3px; border-left-width: 3px;  border-radius: 0 0 0 5px; }
    .pm-qris-corner.br { bottom: 7px; right: 7px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 5px 0; }
    .pm-qris-amount {

    .pm-no-metode-btn { width: 100%; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#ff9800,#ffbd5d); color: #fff; font-size: 13px; font-weight: 700; border: none; box-shadow: 0 4px 16px rgba(255,152,0,0.35); cursor: pointer; font-family: inherit; transition: transform .1s, opacity .1s; }

<script>
(function () {
  "use strict";

  /* ── Auth guard ── */
  var session = {};
  try { session = JSON.parse(localStorage.getItem("anabulku_user_session")) || {}; } catch(e) {}
  var isGuest = !session.loggedIn;

  if (isGuest) {
    var listEl = document.getElementById("bookingList");
    if (listEl) listEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center;">' +
      '<div style="font-size:48px;">🔒</div>' +
      '<div style="font-size:15px;font-weight:700;color:#1F2937;">Login untuk melihat riwayat</div>' +
      '<div style="font-size:13px;color:#6B7280;line-height:1.5;">Riwayat booking kamu akan tersimpan setelah login.</div>' +
      '<button onclick="location.href=\'login.html\'" style="margin-top:8px;padding:12px 28px;border-radius:12px;border:none;background:linear-gradient(135deg,#ff9800,#ffbd5d);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(255,152,0,0.35);color:#fff;">Masuk Sekarang</button>' +
      '</div>';
    return;
  }

  var username = session.username || session.nama || "Pengguna";
  var inisial  = username.slice(0,2).toUpperCase();
  var avatarEl  = document.getElementById("userAvatar");
  var greetEl   = document.getElementById("userGreeting");
  if (avatarEl) avatarEl.textContent  = inisial;
  if (greetEl)  greetEl.textContent   = username;

  /* ── Helpers ── */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fmtTanggal(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00");
    return d.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
  }
  function fmtHarga(v) {
    if (!v) return null;
    var n = parseInt(String(v).replace(/\D/g,""), 10);
    return isNaN(n) || n <= 0 ? null : "Rp " + n.toLocaleString("id-ID");
  }

  /* ── Status mapping ── */
  /* status = status klinik (menunggu/dikonfirmasi/selesai/dibatalkan)
     statusPembayaran = status bayar (menunggu_pembayaran/bayar_ditempat/lunas) */
  var STATUS = {
    menunggu:              { label:"Menunggu Konfirmasi",  strip:"s-menunggu",     pill:"s-menunggu"     },
    dikonfirmasi:          { label:"Dikonfirmasi",         strip:"s-dikonfirmasi", pill:"s-dikonfirmasi" },
    selesai:               { label:"Selesai",              strip:"s-selesai",      pill:"s-selesai"      },
    dibatalkan:            { label:"Dibatalkan",           strip:"s-dibatalkan",   pill:"s-dibatalkan"   },
  };
  var STATUS_BAYAR = {
    menunggu_pembayaran:  { label:"Belum Dibayar",         strip:"s-pending",      pill:"s-pending"      },
    menunggu_konfirmasi:  { label:"Menunggu Konfirmasi",   strip:"s-menunggu",     pill:"s-menunggu"     },
    bayar_ditempat:       { label:"Bayar di Tempat",       strip:"s-menunggu",     pill:"s-menunggu"     },
    lunas:                { label:"Lunas",                 strip:"s-dikonfirmasi", pill:"s-dikonfirmasi" },
    dibatalkan:           { label:"Dibatalkan",            strip:"s-dibatalkan",   pill:"s-dibatalkan"   },
  };
  function getStatus(b) {
    var st = (b.status || "").toLowerCase();
    /* Booking dibatalkan — prioritas tertinggi */
    if (st === "dibatalkan") return STATUS.dibatalkan;
    /* Belum bayar sama sekali (masih di halaman payment) */
    if (b._isPending) return { label:"Menunggu Pembayaran", strip:"s-pending", pill:"s-pending" };
    /* Status klinik dikonfirmasi/selesai — prioritas di atas statusPembayaran */
    if (st === "dikonfirmasi") return STATUS.dikonfirmasi;
    if (st === "selesai")      return STATUS.selesai;
    /* Sudah transfer tapi klinik belum konfirmasi */
    if (b.statusPembayaran && STATUS_BAYAR[b.statusPembayaran]) {
      return STATUS_BAYAR[b.statusPembayaran];
    }
    /* Fallback ke status klinik */
    return STATUS[st] || { label: b.status||"—", strip:"s-pending", pill:"s-pending" };
  }

  /* ── Auto-cancel booking yang deadlinenya sudah lewat ── */
  function cancelExpiredBookings() {
    try {
      var now = Date.now();
      var changed = false;

      /* Cek pending payment */
      var pend = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
      if (pend && pend.paymentDeadline) {
        if (new Date(pend.paymentDeadline).getTime() <= now) {
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var pi = bks.findIndex(function(b) { return b.id === pend.id; });
          if (pi >= 0) {
            releaseSlotFromMitra(bks[pi]);      /* bebaskan jadwal di mitraKlinik */
            cancelInNamespace(bks[pi]);         /* update namespace klinik agar slot bebas */
            bks[pi].status = "dibatalkan";
            bks[pi].statusPembayaran = "dibatalkan";
            bks[pi].cancelledReason = "timeout";
            changed = true;
          } else {
            /* booking belum masuk global — batalkan via data pending langsung */
            releaseSlotFromMitra(pend);
            cancelInNamespace(pend);
          }
          localStorage.removeItem("anabulku_pending_payment");
          if (changed) localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        }
      }

      /* Cek semua booking yang masih "menunggu" dan punya paymentDeadline */
      var bksAll = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
      var anyExpired = false;
      bksAll.forEach(function(b) {
        if (b.paymentDeadline && b.status === "menunggu" && !b.statusPembayaran) {
          if (new Date(b.paymentDeadline).getTime() <= now) {
            releaseSlotFromMitra(b);            /* bebaskan jadwal di mitraKlinik */
            cancelInNamespace(b);               /* update namespace klinik */
            b.status = "dibatalkan";
            b.statusPembayaran = "dibatalkan";
            b.cancelledReason = "timeout";
            anyExpired = true;
          }
        }
      });
      if (anyExpired) localStorage.setItem("anabulku_bookings", JSON.stringify(bksAll));
    } catch(e) { /* silent */ }
  }

  /* Update status booking di namespace per-klinik (anabulku_bookings_<mitraId>)
     agar getBookedSlots() di clinic-detail.js ikut membebaskan slot */
  function cancelInNamespace(booking) {
    try {
      if (!booking || !booking.id) return;
      /* Cari mitraId dari mitraKlinik berdasarkan nama klinik atau dokter */
      var mitraList = JSON.parse(localStorage.getItem('mitraKlinik')) || [];
      mitraList.forEach(function(klinik) {
        var mitraId = klinik.id || klinik.mitraId || '';
        if (!mitraId) return;
        var nsKey = 'anabulku_bookings_' + mitraId;
        var nsRaw = localStorage.getItem(nsKey);
        if (!nsRaw) return;
        var nsBks = JSON.parse(nsRaw);
        var changed = false;
        nsBks = nsBks.map(function(b) {
          if (b.id === booking.id && b.status !== 'dibatalkan') {
            changed = true;
            return Object.assign({}, b, {
              status: 'dibatalkan',
              statusPembayaran: 'dibatalkan',
              cancelledReason: 'timeout'
            });
          }
          return b;
        });
        if (changed) localStorage.setItem(nsKey, JSON.stringify(nsBks));
      });
    } catch(e) { /* silent */ }
  }

  cancelExpiredBookings();

  /* ── Load data ── */
  /* Baca pending payment sekali, simpan di variabel module-level agar renderCard bisa akses */
  var _pendingPayment = null;
  try {
    _pendingPayment = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
  } catch(e) { _pendingPayment = null; }

  function reloadPending() {
    try {
      _pendingPayment = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
    } catch(e) { _pendingPayment = null; }
  }

  function loadAll() {
    reloadPending();
    var bks = [];
    try { bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || []; } catch(e) {}

    var pendingId = (_pendingPayment && _pendingPayment.id) ? _pendingPayment.id : null;

    /* Semua booking milik user app */
    var result = bks.filter(function(b) {
      return b.sumber === "app_user" || !b.sumber;
    });

    /* Tandai booking yang masih pending payment —
       Sumber pendingId: dari anabulku_pending_payment ATAU dari booking dengan
       statusPembayaran menunggu_pembayaran yang belum konfirmasi/selesai/batal */
    if (!pendingId) {
      var autoDetect = result.find(function(b) {
        var s = (b.status || "").toLowerCase();
        var sp = (b.statusPembayaran || "").toLowerCase();
        return sp === "menunggu_pembayaran" &&
               s !== "dikonfirmasi" && s !== "selesai" && s !== "dibatalkan";
      });
      if (autoDetect) pendingId = autoDetect.id;
    }

    var foundPending = false;
    result = result.map(function(b) {
      var bStatus = (b.status || "").toLowerCase();
      var sudahKonfirmasi = bStatus === "dikonfirmasi" || bStatus === "selesai" || bStatus === "dibatalkan";
      if (pendingId && b.id === pendingId && !sudahKonfirmasi) {
        foundPending = true;
        /* Ambil paymentDeadline dari _pendingPayment atau dari booking itu sendiri.
           Kalau sama sekali tidak ada, generate dari waktu booking + 5 menit dan simpan
           agar timer bisa jalan meski user belum buka payment.html */
        var dl = (_pendingPayment && _pendingPayment.paymentDeadline) || b.paymentDeadline;
        if (!dl) {
          var base = b.createdAt || b.waktuBooking || b.timestamp || new Date().toISOString();
          dl = new Date(new Date(base).getTime() + 5 * 60 * 1000).toISOString();
          /* Simpan deadline ke pending_payment agar konsisten */
          try {
            var pp = _pendingPayment ? Object.assign({}, _pendingPayment, { paymentDeadline: dl })
                                     : Object.assign({}, b, { paymentDeadline: dl });
            localStorage.setItem("anabulku_pending_payment", JSON.stringify(pp));
            _pendingPayment = pp;
          } catch(e) {}
        }
        return Object.assign({}, b, { _isPending: true, paymentDeadline: dl });
      }
      return b;
    });

    /* Jika pending belum masuk bookings (race condition), sisipkan di awal */
    if (pendingId && !foundPending && _pendingPayment) {
      var pStatus = (_pendingPayment.status || "").toLowerCase();
      if (pStatus !== "dikonfirmasi" && pStatus !== "selesai" && pStatus !== "dibatalkan") {
        result = [Object.assign({}, _pendingPayment, { _isPending: true, paymentDeadline: _pendingPayment.paymentDeadline })].concat(result);
      }
    }

    return result;
  }

  function isPending(b) {
    /* Hanya booking yang benar-benar belum dikonfirmasi klinik */
    if (b._isPending) return true;
    var s = (b.status || "").toLowerCase();
    return s === "menunggu";
  }

  /* ── Render card ── */
  function renderCard(b) {
    var st    = getStatus(b);
    var ref   = b.id ? 'ANB-' + b.id.slice(-6).toUpperCase() : '—';
    var biayaNum = parseInt(String(b.harga || b.totalHarga || b.biaya || '0').replace(/\D/g, ''), 10) || 0;
    var harga    = biayaNum > 0 ? fmtHarga(biayaNum) : null;
    var total    = biayaNum > 0 ? 'Rp ' + (biayaNum + 5000).toLocaleString('id-ID') : null;
    var svgRupiah = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
    var tgl   = fmtTanggal(b.tanggal) + (b.jam ? ' · ' + esc(b.jam) : '');
    var hewan = esc(b.namaHewan || '—') + (b.jenisHewan ? ' · ' + esc(b.jenisHewan) : '');

    /* Info rows dengan icon */
    var info = '';
    info += row('Jadwal','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',tgl,false);
    info += row('Dokter','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',esc(b.dokter || '—'),false);
    info += row('Hewan','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',hewan,false);
    if (b.layanan || b.service) info += row('Layanan','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>',esc(b.layanan || b.service),false);
    if (harga) info += row('Biaya Layanan', svgRupiah, harga, false);
    if (harga) info += row('Biaya Platform', svgRupiah, '<span style="opacity:0.6;">Rp 5.000</span>', false);
    if (total) info += row('Total Bayar', svgRupiah, total, true);

    /* Footer */
    var foot = '';
    var statusNow = (b.status || '').toLowerCase();
    var sudahBayar = b.statusPembayaran === 'lunas' || b.statusPembayaran === 'bayar_ditempat';

    if (statusNow === 'dikonfirmasi') {
      foot = '<div class="card-foot card-foot--confirmed">' +
        '<div class="foot-confirmed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div><div class="foot-confirmed-badge">✔ Terkonfirmasi</div>' +
        '<div class="foot-confirmed-sub">Silakan datang sesuai jadwal</div></div>' +
        '</div>';
    } else if (!sudahBayar && b.statusPembayaran === 'menunggu_konfirmasi') {
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Menunggu konfirmasi klinik</b></div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Cek Pembayaran</button>' +
        '</div>';
    } else if (!sudahBayar && b.statusPembayaran === 'menunggu_pembayaran') {
      var urgM   = b.paymentDeadline && (new Date(b.paymentDeadline).getTime() - Date.now()) <= 60000;
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Menunggu pembayaran</b></div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Cek Pembayaran</button>' +
        '</div>' +
        (b.paymentDeadline ? '<div class="pending-info-bar' + (urgM ? ' urgent' : '') + '" data-deadline-bar="' + esc(b.paymentDeadline) + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>Transaksi akan <b>hangus otomatis</b> jika tidak dibayar dalam 5 menit. Jadwal akan kembali tersedia setelah batas waktu.</span>' +
        '</div>' : '');
    } else if (!sudahBayar && (b._isPending || statusNow === 'menunggu')) {
      var tPillP = buildTimerPill(b.paymentDeadline);
      var urgP   = b.paymentDeadline && (new Date(b.paymentDeadline).getTime() - Date.now()) <= 60000;
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Belum lunas</b>' + (tPillP ? ' ' + tPillP : '') + '</div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>' +
        'Cek Pembayaran</button>' +
        '</div>' +
        (b.paymentDeadline ? '<div class="pending-info-bar' + (urgP ? ' urgent' : '') + '" data-deadline-bar="' + esc(b.paymentDeadline) + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>Transaksi akan <b>hangus otomatis</b> jika tidak dibayar dalam 5 menit. Jadwal akan kembali tersedia setelah batas waktu.</span>' +
        '</div>' : '');
    }

    return '<article class="booking-card" aria-label="Booking ' + esc(b.namaKlinik || 'Klinik') + '">' +
      '<div class="card-accent ' + st.pill + '"></div>' +
      '<div class="card-head">' +
        '<div class="card-avatar ' + st.pill + '">🏥</div>' +
        '<div class="card-head-text"><div class="card-klinik">' + esc(b.namaKlinik || 'Klinik') + '</div><div class="card-ref">' + ref + '</div></div>' +
        '<span class="status-pill ' + st.pill + '"><span class="status-pill-dot"></span>' + esc(st.label) + '</span>' +
      '</div>' +
      '<div class="card-divider"></div>' +
      '<div class="card-body">' +
        '<div class="card-field"><div class="card-field-label">Jadwal</div><div class="card-field-val">' + esc(fmtTanggal(b.tanggal)) + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Jam</div><div class="card-field-val">' + esc(b.jam || '—') + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Dokter</div><div class="card-field-val">' + esc(b.dokter || '—') + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Hewan</div><div class="card-field-val">' + esc(b.namaHewan || '—') + '</div></div>' +
        (total && b.paymentDeadline && ['dibatalkan','selesai','dikonfirmasi'].indexOf((b.status||'').toLowerCase()) < 0
          ? '<div class="card-field"><div class="card-field-label">Total Biaya</div><div class="card-field-val harga">' + total + '</div></div>' +
            '<div class="card-field"><div class="card-field-label">Batas Waktu</div><div class="card-field-val timer-val">' + buildTimerPill(b.paymentDeadline) + '</div></div>'
          : (total ? '<div class="card-field full"><div class="card-field-label">Total Biaya</div><div class="card-field-val harga">' + total + '</div></div>' : '')) +
      '</div><div class="card-divider"></div>' +
      foot +
      '</article>';
  }

  /* Render satu row info dengan icon */
  function row(label, iconSvg, val, isPrice) {
    var rowCls = isPrice ? 'info-row price-row' : 'info-row';
    var valCls = isPrice ? 'info-row-val price' : 'info-row-val';
    return '<div class="' + rowCls + '">' +
      '<div class="info-row-icon">' + iconSvg + '</div>' +
      '<div class="info-row-body">' +
        '<div class="info-row-label">' + label + '</div>' +
        '<div class="' + valCls + '">' + val + '</div>' +
      '</div>' +
      '</div>';
  }

  /* Timer pill HTML dari deadline string */
  function buildTimerPill(deadline) {
    if (!deadline) return '';
    var rem = Math.max(0, new Date(deadline).getTime() - Date.now());
    var sec = Math.ceil(rem / 1000);
    var tm  = Math.floor(sec / 60), ts = sec % 60;
    var tStr = (tm < 10 ? '0' : '') + tm + ':' + (ts < 10 ? '0' : '') + ts;
    var urgCls = rem <= 60000 ? ' urgent' : '';
    return '<div class="card-timer' + urgCls + '" data-deadline="' + esc(deadline) + '">' +
      '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 15 15"/></svg>' +
      '<span>' + tStr + '</span></div>';
  }

  /* ── Filter & render ── */
  var currentFilter = "semua";

  function render() {
    var all      = loadAll();
    var list     = document.getElementById("bookingList");

    var filtered = all.filter(function(b) {
      if (currentFilter === "semua")        return true;
      if (currentFilter === "pending")      return isPending(b);
      if (currentFilter === "dikonfirmasi") return (b.status||"").toLowerCase() === "dikonfirmasi";
      if (currentFilter === "selesai")      return (b.status||"").toLowerCase() === "selesai";
      if (currentFilter === "dibatalkan")   return (b.status||"").toLowerCase() === "dibatalkan";
      return true;
    });

    if (!filtered.length) {
      list.innerHTML =
        '<div class="empty" role="status">' +
          '<div class="empty-illo">📋</div>' +
          '<p class="empty-title">Belum ada booking</p>' +
          '<p class="empty-sub">Kamu belum punya riwayat booking.<br>Yuk cari klinik dan buat janji sekarang!</p>' +
          '<button class="btn-explore" type="button" onclick="location.href=\'home.html\'">Cari Klinik Sekarang</button>' +
        '</div>';
      return;
    }

    /* Update badge notif di icon Riwayat */
    var totalBelumBayar = all.filter(function(b) {
      var s = (b.status||"").toLowerCase();
      var bayar = b.statusPembayaran || "";
      var sudahBayar = bayar === "lunas" || bayar === "bayar_ditempat";
      var dibatalkan = s === "dibatalkan" || bayar === "dibatalkan";
      return !sudahBayar && !dibatalkan && (b._isPending || s === "menunggu" || s === "dikonfirmasi");
    }).length;
    var badge = document.getElementById("pendingBadge");
    if (badge) {
      if (totalBelumBayar > 0) {
        badge.textContent = totalBelumBayar;
        badge.style.display = "inline-flex";
        badge.removeAttribute("hidden");
      } else {
        badge.style.display = "none";
        badge.setAttribute("hidden", "");
      }
    }

    list.innerHTML = filtered.map(renderCard).join("");

    // Wire actions
    /* Handler lihat-pembayaran */
    list.querySelectorAll("[data-action='cek-pembayaran']").forEach(function(btn) {
      btn.addEventListener('click', function() {
        openPayModal(btn.getAttribute('data-id') || '');
      });
    });

    list.querySelectorAll("[data-action='lanjutkan']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        /* Pastikan data pending tersedia sebelum masuk ke payment.html */
        try {
          var existing = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
          /* Kalau pending sudah ada dan id-nya sama, langsung redirect */
          if (!existing || existing.id !== id) {
            /* Cari data booking dari anabulku_bookings, lalu set sebagai pending */
            var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
            var booking = bks.find(function(b) { return b.id === id; });
            if (booking) {
              /* Pastikan namaKlinik tersedia — cari dari mitraKlinik jika belum ada */
              if (!booking.namaKlinik) {
                try {
                  var klinikList = JSON.parse(localStorage.getItem("mitraKlinik")) || [];
                  /* Cari klinik berdasarkan nama dokter */
                  var klinikMatch = klinikList.find(function(k) {
                    return Array.isArray(k.dokters) && k.dokters.some(function(d) {
                      return d.nama === booking.dokter;
                    });
                  });
                  if (klinikMatch) booking = Object.assign({}, booking, { namaKlinik: klinikMatch.namaKlinik });
                } catch(e2) {}
              }
              localStorage.setItem("anabulku_pending_payment", JSON.stringify(booking));
            }
          }
        } catch(e) {}
        location.href = "pembayaran.html";
      });
    });
    list.querySelectorAll("[data-action='cancel-pending']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (!confirm("Yakin ingin membatalkan booking ini?")) return;
        var id = btn.getAttribute("data-id");
        try {
          /* Hapus pending payment */
          localStorage.removeItem("anabulku_pending_payment");
          /* Tandai booking sebagai dibatalkan di anabulku_bookings */
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var idx = bks.findIndex(function(b){ return b.id === id; });
          if (idx >= 0) {
            releaseSlotFromMitra(bks[idx]);
            bks[idx].status = "dibatalkan";
            bks[idx].statusPembayaran = "dibatalkan";
          }
          localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        } catch(e){}
        reloadPending();
        render();
      });
    });
    list.querySelectorAll("[data-action='cancel']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        if (!confirm("Yakin ingin membatalkan booking ini?")) return;
        try {
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var idx = bks.findIndex(function(b){ return b.id === id; });
          if (idx >= 0) {
            releaseSlotFromMitra(bks[idx]);
            bks[idx].status = "dibatalkan";
            bks[idx].statusPembayaran = "dibatalkan";
          }
          localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        } catch(e){}
        render();
      });
    });
  }

  /* ── Bebaskan slot di mitraKlinik saat booking dibatalkan ── */
  function releaseSlotFromMitra(booking) {
    try {
      var mitraList = JSON.parse(localStorage.getItem('mitraKlinik')) || [];
      mitraList = mitraList.map(function(klinik) {
        if (!klinik.bookedSlots) return klinik;
        klinik.bookedSlots = klinik.bookedSlots.filter(function(s) {
          return !(
            s.dokter  === booking.dokter  &&
            s.tanggal === booking.tanggal &&
            s.jam     === booking.jam
          );
        });
        return klinik;
      });
      localStorage.setItem('mitraKlinik', JSON.stringify(mitraList));
    } catch(e) {}
  }


  /* ── Modal Pembayaran ── */
  function openPayModal(bookingId) {

    var bks=[];try{bks=JSON.parse(localStorage.getItem('anabulku_bookings'))||[];}catch(e){}

    var b=bks.find(function(x){return x.id===bookingId;});

    /* Fallback 1: coba cari di pending_payment — object tunggal */
    if(!b){
      try{
        var pp=JSON.parse(localStorage.getItem('anabulku_pending_payment'));
        if(pp && !Array.isArray(pp) && pp.id===bookingId) b=pp;
        /* Fallback 2: pending_payment berupa array */
        if(!b && Array.isArray(pp)){
          b=pp.find(function(x){return x.id===bookingId;});
        }
      }catch(e){}
    }

    /* Fallback 3: kalau ID kosong, ambil pending_payment tunggal */
    if(!b && (!bookingId || bookingId==='')){
      try{
        var pp2=JSON.parse(localStorage.getItem('anabulku_pending_payment'));
        if(pp2 && !Array.isArray(pp2)) b=pp2;
      }catch(e){}
    }

    /* Fallback 4: kalau masih tidak ketemu, tampilkan modal "tidak ditemukan" */
    if(!b){
      document.getElementById('payTitle').textContent='Info Pembayaran';
      document.getElementById('payBody').innerHTML=
        '<div class="pm-no-metode">'+
          '<div class="pm-no-metode-ico">🔍</div>'+
          '<div class="pm-no-metode-title">Data booking tidak ditemukan</div>'+
          '<div class="pm-no-metode-sub">Data pembayaran untuk booking ini belum tersedia.<br>Coba lakukan booking ulang jika diperlukan.</div>'+
        '</div>'+
        '<button class="pc-close-btn" type="button" onclick="closePayModal()">Tutup</button>';
      document.getElementById('payOverlay').classList.add('open');
      return;
    }

    /* Kalau belum ada metode pembayaran - tampilkan modal info
       agar user tahu harus memilih metode dulu */
    if(!b.metodePembayaran && !b.metode){
      var _b=b;
      document.getElementById('payBody').innerHTML=
        '<div class="pm-no-metode">'+
          '<div class="pm-no-metode-ico">💳</div>'+
          '<div class="pm-no-metode-title">Metode pembayaran belum dipilih</div>'+
          '<div class="pm-no-metode-sub">Silakan pilih metode pembayaran<br>untuk melanjutkan booking ini.</div>'+
          '<button type="button" id="btnGoPayment" class="pm-no-metode-btn">Pilih Metode Pembayaran &#x2192;</button>'+
        '</div>'+
        '<button class="pc-close-btn" type="button" onclick="closePayModal()">Tutup</button>';
      document.getElementById('payOverlay').classList.add('open');
      setTimeout(function(){
        var gbtn=document.getElementById('btnGoPayment');
        if(gbtn) gbtn.addEventListener('click',function(){
          try{localStorage.setItem('anabulku_pending_payment',JSON.stringify(_b));}catch(e){}
          location.href='pembayaran.html';
        });
      },50);
      return;
    }


    var metode=(b.metodePembayaran||b.metode).toLowerCase();

    var statusPay=(b.statusPembayaran||'').toLowerCase();

    var badgeCls=statusPay==='lunas'?'lunas':statusPay==='menunggu_konfirmasi'?'menunggu':'belum';

    var badgeTxt=statusPay==='lunas'?'Lunas':statusPay==='menunggu_konfirmasi'?'Menunggu konfirmasi':'Belum lunas';

    var hargaTxt=b.harga?fmtHarga(b.harga):null;

    var VA={

      bca:{ico:'🔵',name:'BCA Virtual Account',prefix:'70720'},

      bni:{ico:'🟠',name:'BNI Virtual Account',prefix:'98814'},

      bri:{ico:'🔵',name:'BRI Virtual Account',prefix:'26215'},

      mandiri:{ico:'🟡',name:'Mandiri Virtual Account',prefix:'70012'},

      transfer:{ico:'🏦',name:'Transfer Bank',prefix:'88800'}

    };


    /* ── Banner metode pembayaran yang dipilih user ── */
    var metodeIco, metodeNama;
    if(metode==='qris'){
      metodeIco='📱'; metodeNama='QRIS';
    } else if(metode==='cash'){
      metodeIco='💵'; metodeNama='Bayar di Tempat (Cash)';
    } else if(metode==='bca'){
      metodeIco='🔵'; metodeNama='BCA Virtual Account';
    } else if(metode==='bni'){
      metodeIco='🟠'; metodeNama='BNI Virtual Account';
    } else if(metode==='bri'){
      metodeIco='🔵'; metodeNama='BRI Virtual Account';
    } else if(metode==='mandiri'){
      metodeIco='🟡'; metodeNama='Mandiri Virtual Account';
    } else {
      metodeIco='🏦'; metodeNama='Transfer Bank';
    }
    var metodeBannerHtml = ''; // unused, kept for compat

    function genVA(m,id){
      var d=VA[m]||VA['transfer'];
      var suf=id?id.replace(/[^0-9]/g,'').slice(-8).padStart(8,'0'):'00000000';
      return d.prefix+suf;
    }

    var sumHtml=
      '<div class="pc-divider"></div>'+
      '<div class="pc-summary">'+
        '<div class="pc-sum-row"><span>Klinik</span><span>'+esc(b.namaKlinik||'—')+'</span></div>'+
        '<div class="pc-sum-row"><span>Dokter</span><span>'+esc(b.dokter||'—')+'</span></div>'+
        '<div class="pc-sum-row"><span>Jadwal</span><span>'+esc(fmtTanggal(b.tanggal))+' '+esc(b.jam||'')+'</span></div>'+
        (hargaTxt?'<div class="pc-sum-row total"><span>Total</span><span>'+hargaTxt+'</span></div>':'')+
      '</div>';

    var payHtml = '';

    if(metode==='qris'){
      payHtml=
        '<div class="pc-badge '+badgeCls+'">'+badgeTxt+'</div>'+
        '<div class="pc-qris-frame">'+
          '<img src="Qris.png" alt="QR Code Pembayaran" id="qrisImg">'+
          '<button class="pc-qris-dl" type="button" title="Download QR" onclick="(function(){'+
            'var a=document.createElement(\'a\');'+
            'a.href=\'Qris.png\';'+
            'a.download=\'QRIS-Pembayaran.png\';'+
            'a.click();'+
          '})()">'+
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+
              '<path d="M12 15V3"/><path d="M7 10l5 5 5-5"/><rect x="3" y="17" width="18" height="4" rx="1"/>'+
            '</svg>'+
          '</button>'+
        '</div>'+
        (hargaTxt?'<div class="pc-qris-amount">'+hargaTxt+'</div>':'');
        '</button>';

    } else if(metode==='cash'){
      payHtml=
        '<span class="pc-badge '+badgeCls+'">'+badgeTxt+'</span>'+
        '<div class="pc-info-row"><span class="pc-info-ico">💵</span>Siapkan uang tunai sesuai tagihan saat tiba di klinik</div>'+
        '<div class="pc-info-row"><span class="pc-info-ico">🪪</span>Tunjukkan bukti booking saat tiba</div>'+
        '<div class="pc-info-row"><span class="pc-info-ico">🏥</span>Bayar di kasir klinik</div>'+
        (hargaTxt?'<div class="pc-info-row" style="color:#ffbd5d;font-weight:700;"><span class="pc-info-ico">💰</span>Total: '+hargaTxt+'</div>':'');

    } else {
      var vk=VA[metode]?metode:'transfer';
      var vi=VA[vk];
      var vn=genVA(vk,b.id);
      payHtml=
        '<span class="pc-badge '+badgeCls+'">'+badgeTxt+'</span>'+
        '<div class="pc-info-row"><span class="pc-info-ico">'+vi.ico+'</span><strong style="color:#fff;">'+vi.name+'</strong></div>'+
        '<div class="pc-info-row" style="flex-direction:column;gap:6px;align-items:stretch;">'+
          '<div style="font-size:10px;color:rgba(255,255,255,0.45);margin-bottom:2px;">Nomor Virtual Account</div>'+
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'+
            '<span style="font-size:15px;font-weight:800;color:#fff;letter-spacing:.04em;">'+vn+'</span>'+
            '<button class="pc-copy-btn" type="button" onclick="(function(btn){navigator.clipboard&&navigator.clipboard.writeText(\''+vn+'\');btn.textContent=\'Tersalin!\';setTimeout(function(){btn.textContent=\'Salin\';},1500);})(this)">Salin</button>'+
          '</div>'+
        '</div>'+
        (hargaTxt?'<div class="pc-info-row"><span class="pc-info-ico">💳</span>Transfer tepat <strong style="color:#ffbd5d;">'+hargaTxt+'</strong></div>':'')+
        '<div class="pc-info-row" style="font-size:11px;"><span class="pc-info-ico">⏱️</span>Dikonfirmasi otomatis dalam 1×24 jam</div>';
    }

    document.getElementById('payBody').innerHTML=payHtml+sumHtml+
      '<button class="pc-close-btn" type="button" id="payCloseBtn">Tutup</button>';
    document.getElementById('payOverlay').classList.add('open');
    document.getElementById('payCloseBtn').addEventListener('click', closePayModal);
  }



    function closePayModal() { document.getElementById('payOverlay').classList.remove('open'); }
  document.getElementById('payClose').addEventListener('click', closePayModal);
  document.getElementById('payOverlay').addEventListener('click', function(e){ if(e.target===this) closePayModal(); });

  // Hapus semua riwayat
  document.getElementById("btnClearAll").addEventListener("click", function() {
    if (!confirm("Hapus semua riwayat booking? Tindakan ini tidak bisa dibatalkan.")) return;
    try {
      localStorage.removeItem("anabulku_bookings");
      localStorage.removeItem("anabulku_pending_payment");
    } catch(e) {}
    render();
  });

  // Filter bar
  document.getElementById("filterBar").addEventListener("click", function(e) {
    var btn = e.target.closest(".filter-chip");
    if (!btn) return;
    document.querySelectorAll(".filter-chip").forEach(function(b){
      b.classList.remove("active"); b.setAttribute("aria-selected","false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected","true");
    currentFilter = btn.getAttribute("data-filter");
    render();
  });

  render();

  /* Live countdown - update timer pill setiap detik */
  setInterval(function() {
    document.querySelectorAll('.card-timer[data-deadline]').forEach(function(el) {
      var dl=new Date(el.getAttribute('data-deadline')).getTime();
      var rem=Math.max(0,dl-Date.now());
      var sec=Math.ceil(rem/1000);
      var tm=Math.floor(sec/60),ts=sec%60;
      var sp=el.querySelector('span');
      if(sp) sp.textContent=(tm<10?'0':'')+tm+':'+(ts<10?'0':'')+ts;
      if(rem<=60000){el.classList.add('urgent');}else{el.classList.remove('urgent');}
      if(rem<=0){ cancelExpiredBookings(); render(); }
    });
    /* Update urgent state pada info bar secara real-time */
    document.querySelectorAll('.pending-info-bar[data-deadline-bar]').forEach(function(el) {
      var dl=new Date(el.getAttribute('data-deadline-bar')).getTime();
      var rem=Math.max(0,dl-Date.now());
      if(rem<=60000){el.classList.add('urgent');}else{el.classList.remove('urgent');}
    });
  },1000);

  /* Handle BFCache — re-render saat halaman di-restore dari cache browser */
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) render();
  });
})();
</script>
</body>
</html>
