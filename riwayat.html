<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCECE3" />
  <title>Riwayat Booking — AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: "Poppins", system-ui, sans-serif;
      background: #e7dbd0;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    body { display: flex; justify-content: center; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; background: none; }

    /* ═══════════════════════════════
       App shell
    ═══════════════════════════════ */
    .app {
      position: relative;
      width: 100%;
      max-width: 393px;
      min-height: 100dvh;
      background: #f5ebe0;
      box-shadow: 0 0 40px -10px rgba(0,0,0,.2);
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    /* ═══════════════════════════════
       Header
    ═══════════════════════════════ */
    .header {
      background: #fcece3;
      padding: 20px 22px 14px;
      flex-shrink: 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-back {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
      box-shadow: 0px 1px 2px rgba(0,0,0,.05);
      color: #4b5563;
      flex-shrink: 0;
      transition: transform .12s;
    }
    .btn-back:active { transform: scale(.94); }
    .btn-back svg { width: 20px; height: 20px; }

    .header-text { min-width: 0; }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #1F2937;
      line-height: 1.3;
    }
    .header-sub {
      font-size: 12px;
      color: #9CA3AF;
      font-weight: 400;
      line-height: 1.4;
      margin-top: 1px;
    }

    /* ═══════════════════════════════
       Filter tabs
    ═══════════════════════════════ */
    .filter-wrap {
      background: #fcece3;
      padding: 8px 0 0;
      flex-shrink: 0;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: #6B7280;
      transition: all .15s;
      white-space: nowrap;
      line-height: 1;
    }
    .filter-chip.active {
      background: linear-gradient(180deg, #FF9800 0%, #FFD21F 100%);
      border-color: #FF9800;
      color: #fff;
      box-shadow: 2px 2px 0 #000;
    }

    /* ═══════════════════════════════
       Scroll content
    ═══════════════════════════════ */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .content::-webkit-scrollbar { width: 0; }

    /* ═══════════════════════════════
       Booking Card — redesign v3
    ═══════════════════════════════ */
    .booking-card {
      background: #fff;
      border-radius: 16px;
      border: none;
      box-shadow: 2px 2px 0 #000;
      overflow: hidden;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    .booking-card .btn-cek {
      pointer-events: auto;
    }

    .card-accent { height: 4px; }
    .card-accent.s-menunggu     { background: linear-gradient(90deg,#F59E0B,#FCD34D); }
    .card-accent.s-dikonfirmasi { background: linear-gradient(90deg,#10B981,#34D399); }
    .card-accent.s-selesai      { background: linear-gradient(90deg,#6366F1,#818CF8); }
    .card-accent.s-dibatalkan   { background: linear-gradient(90deg,#EF4444,#F87171); }
    .card-accent.s-pending      { background: linear-gradient(90deg,#F97316,#FDBA74); }

    .card-head {
      padding: 14px 16px 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .card-avatar {
      flex-shrink: 0; width: 42px; height: 42px;
      border-radius: 12px; display: grid; place-items: center; font-size: 18px;
    }
    .card-avatar.s-menunggu     { background: #FEF3C7; }
    .card-avatar.s-dikonfirmasi { background: #D1FAE5; }
    .card-avatar.s-selesai      { background: #EDE9FE; }
    .card-avatar.s-dibatalkan   { background: #FEE2E2; }
    .card-avatar.s-pending      { background: #FFF7ED; }
    .card-head-text { flex: 1; min-width: 0; }
    .card-klinik {
      font-size: 14px; font-weight: 800; color: #111827;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-ref { font-size: 10px; font-weight: 500; color: #9CA3AF; margin-top: 1px; font-family: monospace; }
    .status-pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; align-self: flex-start;
    }
    .status-pill-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .status-pill.s-menunggu     { background: #FEF3C7; color: #92400E; }
    .status-pill.s-dikonfirmasi { background: #D1FAE5; color: #065F46; }
    .status-pill.s-selesai      { background: #EDE9FE; color: #4C1D95; }
    .status-pill.s-dibatalkan   { background: #FEE2E2; color: #991B1B; }
    .status-pill.s-pending      { background: #FFF7ED; color: #C2410C; }
    .status-pill.s-menunggu     .status-pill-dot { background: #F59E0B; }
    .status-pill.s-dikonfirmasi .status-pill-dot { background: #10B981; }
    .status-pill.s-selesai      .status-pill-dot { background: #6366F1; }
    .status-pill.s-dibatalkan   .status-pill-dot { background: #EF4444; }
    .status-pill.s-pending      .status-pill-dot { background: #F97316; }

    .card-body {
      padding: 0 16px 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px;
    }
    .card-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .card-field.full { grid-column: 1/-1; }
    .card-field-label {
      font-size: 9.5px; font-weight: 600; color: #9CA3AF;
      text-transform: uppercase; letter-spacing: .4px;
    }
    .card-field-val {
      font-size: 12.5px; font-weight: 700; color: #1F2937;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-field-val.harga { color: #EA580C; font-size: 13px; font-weight: 800; }
    .card-field-val.timer-val { display: flex; align-items: center; overflow: visible; }
    .card-divider { height: 1px; background: #F3F4F6; margin: 0 16px; }

    .card-foot {
      padding: 10px 14px 12px;
      display: flex; gap: 8px; align-items: center;
    }
    .card-foot-info {
      flex: 1; min-width: 0; font-size: 11px; color: #6B7280; line-height: 1.4;
    }
    .card-foot-info b { display: block; font-size: 12px; color: #374151; font-weight: 700; }
    .btn-cek {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 10px 14px; border-radius: 10px;
      background: linear-gradient(135deg,#FF9800,#FFB300);
      color: #fff; font-size: 12px; font-weight: 700;
      border: 2px solid #111827; box-shadow: 2px 2px 0 #111827;
      transition: transform .1s, box-shadow .1s; flex-shrink: 0; white-space: nowrap;
    }
    .btn-cek:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #111827; }
    .btn-cek svg { width: 14px; height: 14px; }
    .card-timer {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; color: #92400E;
      background: #FEF3C7; border: 1px solid #FDE68A; border-radius: 20px; padding: 2px 8px;
    }
    .card-timer.urgent { color: #991B1B; background: #FEE2E2; border-color: #FECACA; }

    /* Banner info hangus otomatis — hanya muncul di card pending */
    .pending-info-bar {
      margin: 0 14px 12px;
      padding: 8px 12px;
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 11px;
      color: #92400E;
      line-height: 1.45;
    }
    .pending-info-bar svg { flex-shrink: 0; margin-top: 1px; }
    .pending-info-bar.urgent {
      background: #FEF2F2;
      border-color: #FECACA;
      color: #991B1B;
    }

    /* Footer konfirmasi */    /* Footer konfirmasi */
    .card-foot--confirmed {
      background: linear-gradient(90deg,#F0FDF4,#F7FFFE);
      border-top: 1px solid #BBF7D0;
      padding: 10px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .foot-confirmed-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #D1FAE5;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .foot-confirmed-icon svg { width: 16px; height: 16px; color: #059669; }
    .foot-confirmed-badge {
      font-size: 12.5px;
      font-weight: 800;
      color: #059669;
      line-height: 1.3;
    }
    .foot-confirmed-sub {
      font-size: 11px;
      color: #6B7280;
      line-height: 1.4;
    }

    .foot-waiting-label {
      font-size: 11px;
      font-weight: 600;
      color: #92400E;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .foot-waiting-label svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ═══════════════════════════════
       Empty state
    ═══════════════════════════════ */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 60px 24px 40px;
      gap: 10px;
    }
    .empty-illo {
      width: 80px; height: 80px;
      border-radius: 0;
      background: none;
      display: grid;
      place-items: center;
      font-size: 52px;
      margin-bottom: 6px;
      box-shadow: none;
    }
    .empty-title { font-size: 17px; font-weight: 700; color: #374151; }
    .empty-sub   { font-size: 13px; color: #9CA3AF; line-height: 1.6; }
    .btn-explore {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      border-radius: 10px;
      background: linear-gradient(90deg, #FF9800, #FFC46D);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 2px 2px 0 #000;
      transition: transform .1s, box-shadow .1s;
    }
    .btn-explore:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #000; }

    /* ── Bottom Sheet Modal Pembayaran ── */
    .pay-overlay {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(17,24,39,.55); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .pay-overlay.open { display: flex; animation: pmFadeIn .22s ease forwards; }
    @keyframes pmFadeIn { from{opacity:0} to{opacity:1} }
    .pay-sheet {
      width: 100%; max-width: 393px; background: #fff;
      border-radius: 24px 24px 0 0;
      border-top: 2.5px solid #111827;
      border-left: 2.5px solid #111827;
      border-right: 2.5px solid #111827;
      box-shadow: 0 -4px 40px rgba(0,0,0,.18);
      padding: 0 0 env(safe-area-inset-bottom,24px);
      animation: pmSlideUp .32s cubic-bezier(.22,.72,0,1) forwards;
      max-height: 92dvh; display: flex; flex-direction: column;
    }
    @keyframes pmSlideUp { from{transform:translateY(110%)} to{transform:translateY(0)} }
    .pay-handle { width: 44px; height: 5px; background: #E5E7EB; border-radius: 99px; margin: 12px auto 0; flex-shrink: 0; }
    .pay-head {
      padding: 14px 18px 14px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1.5px solid #F3F4F6; flex-shrink: 0;
      background: linear-gradient(135deg,#FFF7ED 0%,#fff 100%);
      border-radius: 22px 22px 0 0;
    }
    .pay-head-left { display: flex; flex-direction: column; gap: 2px; }
    .pay-head-title { font-size: 15px; font-weight: 800; color: #111827; }
    .pay-head-sub {
      font-size: 11px; font-weight: 600; color: #F97316;
      background: #FFF7ED; border: 1px solid #FED7AA;
      border-radius: 99px; padding: 2px 8px; display: inline-block; width: fit-content;
    }
    .pay-head-close {
      width: 34px; height: 34px; border-radius: 10px;
      border: 2px solid #111827; box-shadow: 2px 2px 0 #111827;
      background: #fff; display: grid; place-items: center; color: #374151;
      transition: transform .1s, box-shadow .1s;
    }
    .pay-head-close:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 #111827; }
    .pay-head-close svg { width: 14px; height: 14px; }
    .pay-body { padding: 16px 18px 4px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; }
    .pay-body::-webkit-scrollbar { width: 0; }
    .pm-card { border: 2px solid #111827; border-radius: 14px; box-shadow: 3px 3px 0 #111827; background: #fff; overflow: hidden; }
    .pm-card-head { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1.5px solid #F3F4F6; background: #FAFAFA; }
    .pm-card-ico { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid #111827; display: grid; place-items: center; flex-shrink: 0; font-size: 20px; background: #FFF7ED; }
    .pm-card-ico.bank { background: #EFF6FF; }
    .pm-card-ico.cash { background: #F0FDF4; }
    .pm-card-meta { flex: 1; min-width: 0; }
    .pm-card-name { font-size: 13px; font-weight: 800; color: #111827; }
    .pm-card-desc { font-size: 11px; color: #6B7280; margin-top: 1px; }
    .pm-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; border: 2px solid; white-space: nowrap; flex-shrink: 0; }
    .pm-badge.menunggu { background: #FEF3C7; color: #92400E; border-color: #F59E0B; }
    .pm-badge.belum    { background: #FEE2E2; color: #991B1B; border-color: #EF4444; }
    .pm-badge.lunas    { background: #D1FAE5; color: #065F46; border-color: #10B981; }

    /* ── Metode pill di header modal ── */
    .pm-metode-banner {
      display: flex; align-items: center; gap: 12px;
      background: linear-gradient(135deg,#FFF7ED,#FFFBEB);
      border: 2px solid #F97316; border-radius: 14px;
      padding: 12px 14px; box-shadow: 2px 2px 0 #111827;
    }
    .pm-metode-ico-wrap {
      width: 44px; height: 44px; border-radius: 12px;
      background: #fff; border: 2px solid #111827; box-shadow: 2px 2px 0 #111827;
      display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
    }
    .pm-metode-ico { font-size: 22px; flex-shrink: 0; }
    .pm-metode-info { flex: 1; min-width: 0; }
    .pm-metode-label { font-size: 10px; font-weight: 700; color: #F97316; text-transform: uppercase; letter-spacing: .6px; }
    .pm-metode-name  { font-size: 14px; font-weight: 800; color: #111827; margin-top: 2px; line-height: 1.2; }
    .pm-qris-box { padding: 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: #FAFAFA; }
    .pm-qris-wrap { width: 220px; height: 220px; border-radius: 14px; border: 2.5px solid #111827; box-shadow: 3px 3px 0 #111827; background: #fff; display: grid; place-items: center; overflow: hidden; padding: 8px; }
    .pm-qris-wrap svg { width: 136px; height: 136px; }
    .pm-qris-label { font-size: 11px; color: #6B7280; text-align: center; line-height: 1.6; }
    .pm-qris-amount { font-size: 18px; font-weight: 800; color: #111827; background: linear-gradient(135deg,#FEF3C7,#FDE68A); border: 2px solid #F59E0B; border-radius: 10px; padding: 6px 18px; box-shadow: 2px 2px 0 #111827; }
    .pm-va-box { padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #FAFAFA; }
    .pm-va-bank-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1.5px solid #E5E7EB; }
    .pm-va-bank-ico { font-size: 20px; flex-shrink: 0; }
    .pm-va-bank-name { font-size: 13px; font-weight: 700; color: #374151; }
    .pm-va-num-box { background: #111827; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 2px solid #374151; }
    .pm-va-num { font-family: monospace; font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 3px; }
    .pm-va-copy { padding: 6px 12px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); color: #fff; font-size: 11px; font-weight: 700; transition: background .15s; }
    .pm-va-copy:active { background: rgba(255,255,255,.25); }
    .pm-va-note { font-size: 11px; color: #9CA3AF; line-height: 1.6; padding: 0 2px; }
    .pm-cash-box { padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #FAFAFA; }
    .pm-cash-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #374151; line-height: 1.4; padding: 9px 12px; background: #fff; border-radius: 8px; border: 1px solid #E5E7EB; }
    .pm-cash-icon { font-size: 16px; flex-shrink: 0; }
    .pm-summary { border: 2px solid #E5E7EB; border-radius: 14px; overflow: hidden; }
    .pm-summary-title { padding: 10px 14px; background: #F9FAFB; font-size: 10px; font-weight: 800; color: #6B7280; text-transform: uppercase; letter-spacing: .6px; border-bottom: 1.5px solid #E5E7EB; display: flex; align-items: center; gap: 6px; }
    .pm-summary-title::before { content: "📋"; font-size: 13px; }
    .pm-summary-rows { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .pm-summary-row { display: flex; justify-content: space-between; align-items: flex-start; font-size: 12px; gap: 8px; }
    .pm-summary-row span:first-child { color: #9CA3AF; flex-shrink: 0; }
    .pm-summary-row span:last-child  { font-weight: 700; color: #1F2937; text-align: right; }
    .pm-summary-row.total { padding-top: 10px; border-top: 1.5px dashed #E5E7EB; margin-top: 2px; }
    .pm-summary-row.total span:first-child { color: #374151; font-weight: 700; font-size: 13px; }
    .pm-summary-row.total span:last-child { color: #EA580C; font-size: 15px; font-weight: 800; }
    .pay-footer { padding: 14px 18px 6px; flex-shrink: 0; border-top: 1.5px solid #F3F4F6; }
    .pay-close-btn {
      width: 100%; padding: 13px; border-radius: 12px;
      background: #fff; color: #374151; font-size: 13px; font-weight: 700;
      border: 2px solid #111827; box-shadow: 3px 3px 0 #111827;
      transition: transform .1s, box-shadow .1s;
    }
    .pay-close-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111827; }

    /* State belum pilih metode */
    .pm-no-metode { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 16px 16px; gap: 8px; }
    .pm-no-metode-ico { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg,#FFF7ED,#FFFBEB); border: 2.5px solid #111827; box-shadow: 3px 3px 0 #111827; display: grid; place-items: center; font-size: 32px; margin-bottom: 4px; }
    .pm-no-metode-title { font-size: 15px; font-weight: 800; color: #111827; }
    .pm-no-metode-sub { font-size: 12px; color: #6B7280; line-height: 1.6; margin-bottom: 8px; }
    .pm-no-metode-btn { width: 100%; padding: 13px; border-radius: 12px; background: linear-gradient(135deg,#F97316,#FB923C); color: #fff; font-size: 13px; font-weight: 700; border: 2px solid #111827; box-shadow: 3px 3px 0 #111827; cursor: pointer; font-family: inherit; transition: transform .1s, box-shadow .1s; }
    .pm-no-metode-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #111827; }


    /* Tombol hapus semua */
    .btn-clear {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      border: 1px solid #FECACA;
      background: #fff;
      color: #EF4444;
      flex-shrink: 0;
      transition: transform .12s, background .12s;
    }
    .btn-clear svg { width: 18px; height: 18px; }
    .btn-clear:active { transform: scale(.94); background: #FEF2F2; }
  </style>
</head>
<body>
<div class="app">

  <!-- ═════ Header ═════ -->
  <header class="header">

  <!-- ═════ Filter ═════ -->

      <button class="filter-chip"        type="button" role="tab" aria-selected="false" data-filter="dikonfirmasi">Dikonfirmasi</button>
      <button class="filter-chip"        type="button" role="tab" aria-selected="false" data-filter="selesai">Selesai</button>
      <button class="filter-chip"        type="button" role="tab" aria-selected="false" data-filter="dibatalkan">Dibatalkan</button>
    </div>

  <!-- ═════ List ═════ -->
  <div class="content" id="bookingList" aria-live="polite">
    <!-- injected by JS -->
  </div>

  <!-- ═════ Bottom nav ═════ -->
  <!-- Modal Pembayaran -->
  <div class="pay-overlay" id="payOverlay" role="dialog" aria-modal="true" aria-labelledby="payTitle">
    <div class="pay-sheet">
      <div class="pay-handle"></div>
      <div class="pay-head">
        <div class="pay-head-left">
          <span class="pay-head-title" id="payTitle">Detail Pembayaran</span>
          <span class="pay-head-sub" id="payHeadSub"></span>
        </div>
        <button class="pay-head-close" id="payClose" type="button" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>

      <div class="pay-body" id="payBody"></div>
      <div class="pay-footer">
        <button class="pay-close-btn" id="payCloseBtn" type="button">Tutup</button>

  <nav class="bottomnav" aria-label="Navigasi utama">
    <button class="nav-btn" type="button" aria-label="Beranda" onclick="location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3 2.4 11.1a1 1 0 0 0 .65 1.76H4.5V20a1 1 0 0 0 1 1H9.5v-5.5h5V21H18.5a1 1 0 0 0 1-1v-7.14h1.45a1 1 0 0 0 .65-1.76L12 3z"/>
      </svg>
      <span class="nav-label">Beranda</span>
    </button>
    <button class="nav-btn active" type="button" aria-label="Riwayat" aria-current="page" style="position:relative">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 8v4l3 3"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span id="pendingBadge" hidden style="position:absolute;top:4px;right:10px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#EF4444;color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;">0</span>
      <span class="nav-label">Riwayat</span>

        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>

    <button class="nav-btn" type="button" aria-label="Profil" onclick="location.href='profil.html'">

        <circle cx="12" cy="8" r="4"/>

</div>
<script>
(function () {
  "use strict";

  /* ── Auth guard ── */
  var session = {};
  try { session = JSON.parse(localStorage.getItem("anabulku_user_session")) || {}; } catch(e) {}
  var isGuest = !session.loggedIn;

  if (isGuest) {
    var listEl = document.getElementById("bookingList");
    if (listEl) listEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center;">' +
      '<div style="font-size:48px;">🔒</div>' +
      '<div style="font-size:15px;font-weight:700;color:#1F2937;">Login untuk melihat riwayat</div>' +
      '<div style="font-size:13px;color:#6B7280;line-height:1.5;">Riwayat booking kamu akan tersimpan setelah login.</div>' +
      '<button onclick="location.href=\'login.html\'" style="margin-top:8px;padding:12px 28px;border-radius:12px;border:2px solid #000;background:linear-gradient(180deg,#FF9800,#FFD21F);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:2px 2px 0 #000;color:#fff;">Masuk Sekarang</button>' +
      '</div>';
    return;
  }

  var username = session.username || session.nama || "Pengguna";
  var inisial  = username.slice(0,2).toUpperCase();
  var avatarEl  = document.getElementById("userAvatar");
  var greetEl   = document.getElementById("userGreeting");
  if (avatarEl) avatarEl.textContent  = inisial;
  if (greetEl)  greetEl.textContent   = username;

  /* ── Helpers ── */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function fmtTanggal(iso) {
    if (!iso) return "—";
    var d = new Date(iso + "T00:00");
    return d.toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
  }
  function fmtHarga(v) {
    if (!v) return null;
    var n = parseInt(String(v).replace(/\D/g,""), 10);
    return isNaN(n) || n <= 0 ? null : "Rp " + n.toLocaleString("id-ID");
  }

  /* ── Status mapping ── */
  /* status = status klinik (menunggu/dikonfirmasi/selesai/dibatalkan)
     statusPembayaran = status bayar (menunggu_pembayaran/bayar_ditempat/lunas) */
  var STATUS = {
    menunggu:              { label:"Menunggu Konfirmasi",  strip:"s-menunggu",     pill:"s-menunggu"     },
    dikonfirmasi:          { label:"Dikonfirmasi",         strip:"s-dikonfirmasi", pill:"s-dikonfirmasi" },
    selesai:               { label:"Selesai",              strip:"s-selesai",      pill:"s-selesai"      },
    dibatalkan:            { label:"Dibatalkan",           strip:"s-dibatalkan",   pill:"s-dibatalkan"   },
  };
  var STATUS_BAYAR = {
    menunggu_pembayaran: { label:"Belum Dibayar",    strip:"s-pending",      pill:"s-pending"      },
    bayar_ditempat:      { label:"Bayar di Tempat",  strip:"s-menunggu",     pill:"s-menunggu"     },
    lunas:               { label:"Lunas",            strip:"s-dikonfirmasi", pill:"s-dikonfirmasi" },
    dibatalkan:          { label:"Dibatalkan",       strip:"s-dibatalkan",   pill:"s-dibatalkan"   },
  };
  function getStatus(b) {
    var st = (b.status || "").toLowerCase();
    /* Booking dibatalkan — prioritas tertinggi */
    if (st === "dibatalkan") return STATUS.dibatalkan;
    /* Belum bayar sama sekali (masih di halaman payment) */
    if (b._isPending) return { label:"Menunggu Pembayaran", strip:"s-pending", pill:"s-pending" };
    /* Status klinik dikonfirmasi/selesai — prioritas di atas statusPembayaran */
    if (st === "dikonfirmasi") return STATUS.dikonfirmasi;
    if (st === "selesai")      return STATUS.selesai;
    /* Sudah transfer tapi klinik belum konfirmasi */
    if (b.statusPembayaran && STATUS_BAYAR[b.statusPembayaran]) {
      return STATUS_BAYAR[b.statusPembayaran];
    }
    /* Fallback ke status klinik */
    return STATUS[st] || { label: b.status||"—", strip:"s-pending", pill:"s-pending" };
  }

  /* ── Auto-cancel booking yang deadlinenya sudah lewat ── */
  function cancelExpiredBookings() {
    try {
      var now = Date.now();
      var changed = false;

      /* Cek pending payment */
      var pend = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
      if (pend && pend.paymentDeadline) {
        if (new Date(pend.paymentDeadline).getTime() <= now) {
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var pi = bks.findIndex(function(b) { return b.id === pend.id; });
          if (pi >= 0) {
            releaseSlotFromMitra(bks[pi]);      /* bebaskan jadwal di mitraKlinik */
            cancelInNamespace(bks[pi]);         /* update namespace klinik agar slot bebas */
            bks[pi].status = "dibatalkan";
            bks[pi].statusPembayaran = "dibatalkan";
            bks[pi].cancelledReason = "timeout";
            changed = true;
          } else {
            /* booking belum masuk global — batalkan via data pending langsung */
            releaseSlotFromMitra(pend);
            cancelInNamespace(pend);
          }
          localStorage.removeItem("anabulku_pending_payment");
          if (changed) localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        }
      }

      /* Cek semua booking yang masih "menunggu" dan punya paymentDeadline */
      var bksAll = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
      var anyExpired = false;
      bksAll.forEach(function(b) {
        if (b.paymentDeadline && b.status === "menunggu" && !b.statusPembayaran) {
          if (new Date(b.paymentDeadline).getTime() <= now) {
            releaseSlotFromMitra(b);            /* bebaskan jadwal di mitraKlinik */
            cancelInNamespace(b);               /* update namespace klinik */
            b.status = "dibatalkan";
            b.statusPembayaran = "dibatalkan";
            b.cancelledReason = "timeout";
            anyExpired = true;
          }
        }
      });
      if (anyExpired) localStorage.setItem("anabulku_bookings", JSON.stringify(bksAll));
    } catch(e) { /* silent */ }
  }

  /* Update status booking di namespace per-klinik (anabulku_bookings_<mitraId>)
     agar getBookedSlots() di clinic-detail.js ikut membebaskan slot */
  function cancelInNamespace(booking) {
    try {
      if (!booking || !booking.id) return;
      /* Cari mitraId dari mitraKlinik berdasarkan nama klinik atau dokter */
      var mitraList = JSON.parse(localStorage.getItem('mitraKlinik')) || [];
      mitraList.forEach(function(klinik) {
        var mitraId = klinik.id || klinik.mitraId || '';
        if (!mitraId) return;
        var nsKey = 'anabulku_bookings_' + mitraId;
        var nsRaw = localStorage.getItem(nsKey);
        if (!nsRaw) return;
        var nsBks = JSON.parse(nsRaw);
        var changed = false;
        nsBks = nsBks.map(function(b) {
          if (b.id === booking.id && b.status !== 'dibatalkan') {
            changed = true;
            return Object.assign({}, b, {
              status: 'dibatalkan',
              statusPembayaran: 'dibatalkan',
              cancelledReason: 'timeout'
            });
          }
          return b;
        });
        if (changed) localStorage.setItem(nsKey, JSON.stringify(nsBks));
      });
    } catch(e) { /* silent */ }
  }

  cancelExpiredBookings();

  /* ── Load data ── */
  /* Baca pending payment sekali, simpan di variabel module-level agar renderCard bisa akses */
  var _pendingPayment = null;
  try {
    _pendingPayment = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
  } catch(e) { _pendingPayment = null; }

  function reloadPending() {
    try {
      _pendingPayment = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
    } catch(e) { _pendingPayment = null; }
  }

  function loadAll() {
    reloadPending();
    var bks = [];
    try { bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || []; } catch(e) {}

    var pendingId = (_pendingPayment && _pendingPayment.id) ? _pendingPayment.id : null;

    /* Semua booking milik user app */
    var result = bks.filter(function(b) {
      return b.sumber === "app_user" || !b.sumber;
    });

    /* Tandai booking yang masih pending payment —
       Sumber pendingId: dari anabulku_pending_payment ATAU dari booking dengan
       statusPembayaran menunggu_pembayaran yang belum konfirmasi/selesai/batal */
    if (!pendingId) {
      var autoDetect = result.find(function(b) {
        var s = (b.status || "").toLowerCase();
        var sp = (b.statusPembayaran || "").toLowerCase();
        return sp === "menunggu_pembayaran" &&
               s !== "dikonfirmasi" && s !== "selesai" && s !== "dibatalkan";
      });
      if (autoDetect) pendingId = autoDetect.id;
    }

    var foundPending = false;
    result = result.map(function(b) {
      var bStatus = (b.status || "").toLowerCase();
      var sudahKonfirmasi = bStatus === "dikonfirmasi" || bStatus === "selesai" || bStatus === "dibatalkan";
      if (pendingId && b.id === pendingId && !sudahKonfirmasi) {
        foundPending = true;
        /* Ambil paymentDeadline dari _pendingPayment atau dari booking itu sendiri.
           Kalau sama sekali tidak ada, generate dari waktu booking + 5 menit dan simpan
           agar timer bisa jalan meski user belum buka payment.html */
        var dl = (_pendingPayment && _pendingPayment.paymentDeadline) || b.paymentDeadline;
        if (!dl) {
          var base = b.createdAt || b.waktuBooking || b.timestamp || new Date().toISOString();
          dl = new Date(new Date(base).getTime() + 5 * 60 * 1000).toISOString();
          /* Simpan deadline ke pending_payment agar konsisten */
          try {
            var pp = _pendingPayment ? Object.assign({}, _pendingPayment, { paymentDeadline: dl })
                                     : Object.assign({}, b, { paymentDeadline: dl });
            localStorage.setItem("anabulku_pending_payment", JSON.stringify(pp));
            _pendingPayment = pp;
          } catch(e) {}
        }
        return Object.assign({}, b, { _isPending: true, paymentDeadline: dl });
      }
      return b;
    });

    /* Jika pending belum masuk bookings (race condition), sisipkan di awal */
    if (pendingId && !foundPending && _pendingPayment) {
      var pStatus = (_pendingPayment.status || "").toLowerCase();
      if (pStatus !== "dikonfirmasi" && pStatus !== "selesai" && pStatus !== "dibatalkan") {
        result = [Object.assign({}, _pendingPayment, { _isPending: true, paymentDeadline: _pendingPayment.paymentDeadline })].concat(result);
      }
    }

    return result;
  }

  function isPending(b) {
    /* Hanya booking yang benar-benar belum dikonfirmasi klinik */
    if (b._isPending) return true;
    var s = (b.status || "").toLowerCase();
    return s === "menunggu";
  }

  /* ── Render card ── */
  function renderCard(b) {
    var st    = getStatus(b);
    var ref   = b.id ? 'ANB-' + b.id.slice(-6).toUpperCase() : '—';
    var harga = fmtHarga(b.harga || b.totalHarga || b.biaya);
    var tgl   = fmtTanggal(b.tanggal) + (b.jam ? ' · ' + esc(b.jam) : '');
    var hewan = esc(b.namaHewan || '—') + (b.jenisHewan ? ' · ' + esc(b.jenisHewan) : '');

    /* Info rows dengan icon */
    var info = '';
    info += row('Jadwal','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',tgl,false);
    info += row('Dokter','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',esc(b.dokter || '—'),false);
    info += row('Hewan','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',hewan,false);
    if (b.layanan || b.service) info += row('Layanan','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>',esc(b.layanan || b.service),false);
    if (harga) info += row('Total Biaya','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',harga,true);

    /* Footer */
    var foot = '';
    var statusNow = (b.status || '').toLowerCase();
    var sudahBayar = b.statusPembayaran === 'lunas' || b.statusPembayaran === 'bayar_ditempat';

    if (statusNow === 'dikonfirmasi') {
      foot = '<div class="card-foot card-foot--confirmed">' +
        '<div class="foot-confirmed-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div><div class="foot-confirmed-badge">✔ Terkonfirmasi</div>' +
        '<div class="foot-confirmed-sub">Silakan datang sesuai jadwal</div></div>' +
        '</div>';
    } else if (!sudahBayar && b.statusPembayaran === 'menunggu_konfirmasi') {
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Menunggu konfirmasi klinik</b></div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Cek Pembayaran</button>' +
        '</div>';
    } else if (!sudahBayar && b.statusPembayaran === 'menunggu_pembayaran') {
      var urgM   = b.paymentDeadline && (new Date(b.paymentDeadline).getTime() - Date.now()) <= 60000;
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Menunggu pembayaran</b></div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Cek Pembayaran</button>' +
        '</div>' +
        (b.paymentDeadline ? '<div class="pending-info-bar' + (urgM ? ' urgent' : '') + '" data-deadline-bar="' + esc(b.paymentDeadline) + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>Transaksi akan <b>hangus otomatis</b> jika tidak dibayar dalam 5 menit. Jadwal akan kembali tersedia setelah batas waktu.</span>' +
        '</div>' : '');
    } else if (!sudahBayar && (b._isPending || statusNow === 'menunggu')) {
      var tPillP = buildTimerPill(b.paymentDeadline);
      var urgP   = b.paymentDeadline && (new Date(b.paymentDeadline).getTime() - Date.now()) <= 60000;
      foot = '<div class="card-foot">' +
        '<div class="card-foot-info"><b>Belum lunas</b>' + (tPillP ? ' ' + tPillP : '') + '</div>' +
        '<button class="btn-cek" type="button" data-id="' + esc(b.id || '') + '" data-action="cek-pembayaran">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>' +
        'Cek Pembayaran</button>' +
        '</div>' +
        (b.paymentDeadline ? '<div class="pending-info-bar' + (urgP ? ' urgent' : '') + '" data-deadline-bar="' + esc(b.paymentDeadline) + '">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<span>Transaksi akan <b>hangus otomatis</b> jika tidak dibayar dalam 5 menit. Jadwal akan kembali tersedia setelah batas waktu.</span>' +
        '</div>' : '');
    }

    return '<article class="booking-card" aria-label="Booking ' + esc(b.namaKlinik || 'Klinik') + '">' +
      '<div class="card-accent ' + st.pill + '"></div>' +
      '<div class="card-head">' +
        '<div class="card-avatar ' + st.pill + '">🏥</div>' +
        '<div class="card-head-text"><div class="card-klinik">' + esc(b.namaKlinik || 'Klinik') + '</div><div class="card-ref">' + ref + '</div></div>' +
        '<span class="status-pill ' + st.pill + '"><span class="status-pill-dot"></span>' + esc(st.label) + '</span>' +
      '</div>' +
      '<div class="card-divider"></div>' +
      '<div class="card-body">' +
        '<div class="card-field"><div class="card-field-label">Jadwal</div><div class="card-field-val">' + esc(fmtTanggal(b.tanggal)) + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Jam</div><div class="card-field-val">' + esc(b.jam || '—') + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Dokter</div><div class="card-field-val">' + esc(b.dokter || '—') + '</div></div>' +
        '<div class="card-field"><div class="card-field-label">Hewan</div><div class="card-field-val">' + esc(b.namaHewan || '—') + '</div></div>' +
        (harga && b.paymentDeadline && ['dibatalkan','selesai','dikonfirmasi'].indexOf((b.status||'').toLowerCase()) < 0
          ? '<div class="card-field"><div class="card-field-label">Total Biaya</div><div class="card-field-val harga">' + harga + '</div></div>' +
            '<div class="card-field"><div class="card-field-label">Batas Waktu</div><div class="card-field-val timer-val">' + buildTimerPill(b.paymentDeadline) + '</div></div>'
          : (harga ? '<div class="card-field full"><div class="card-field-label">Total Biaya</div><div class="card-field-val harga">' + harga + '</div></div>' : '')) +
      '</div><div class="card-divider"></div>' +
      foot +
      '</article>';
  }

  /* Render satu row info dengan icon */
  function row(label, iconSvg, val, isPrice) {
    var rowCls = isPrice ? 'info-row price-row' : 'info-row';
    var valCls = isPrice ? 'info-row-val price' : 'info-row-val';
    return '<div class="' + rowCls + '">' +
      '<div class="info-row-icon">' + iconSvg + '</div>' +
      '<div class="info-row-body">' +
        '<div class="info-row-label">' + label + '</div>' +
        '<div class="' + valCls + '">' + val + '</div>' +
      '</div>' +
      '</div>';
  }

  /* Timer pill HTML dari deadline string */
  function buildTimerPill(deadline) {
    if (!deadline) return '';
    var rem = Math.max(0, new Date(deadline).getTime() - Date.now());
    var sec = Math.ceil(rem / 1000);
    var tm  = Math.floor(sec / 60), ts = sec % 60;
    var tStr = (tm < 10 ? '0' : '') + tm + ':' + (ts < 10 ? '0' : '') + ts;
    var urgCls = rem <= 60000 ? ' urgent' : '';
    return '<div class="card-timer' + urgCls + '" data-deadline="' + esc(deadline) + '">' +
      '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 15 15"/></svg>' +
      '<span>' + tStr + '</span></div>';
  }

  /* ── Filter & render ── */
  var currentFilter = "semua";

  function render() {
    var all      = loadAll();
    var list     = document.getElementById("bookingList");

    var filtered = all.filter(function(b) {
      if (currentFilter === "semua")        return true;
      if (currentFilter === "pending")      return isPending(b);
      if (currentFilter === "dikonfirmasi") return (b.status||"").toLowerCase() === "dikonfirmasi";
      if (currentFilter === "selesai")      return (b.status||"").toLowerCase() === "selesai";
      if (currentFilter === "dibatalkan")   return (b.status||"").toLowerCase() === "dibatalkan";
      return true;
    });

    if (!filtered.length) {
      list.innerHTML =
        '<div class="empty" role="status">' +
          '<div class="empty-illo">📋</div>' +
          '<p class="empty-title">Belum ada booking</p>' +
          '<p class="empty-sub">Kamu belum punya riwayat booking.<br>Yuk cari klinik dan buat janji sekarang!</p>' +
          '<button class="btn-explore" type="button" onclick="location.href=\'home.html\'">Cari Klinik Sekarang</button>' +
        '</div>';
      return;
    }

    /* Update badge notif di icon Riwayat */
    var totalBelumBayar = all.filter(function(b) {
      var s = (b.status||"").toLowerCase();
      var bayar = b.statusPembayaran || "";
      var sudahBayar = bayar === "lunas" || bayar === "bayar_ditempat";
      var dibatalkan = s === "dibatalkan" || bayar === "dibatalkan";
      return !sudahBayar && !dibatalkan && (b._isPending || s === "menunggu" || s === "dikonfirmasi");
    }).length;
    var badge = document.getElementById("pendingBadge");
    if (badge) {
      if (totalBelumBayar > 0) {
        badge.textContent = totalBelumBayar;
        badge.style.display = "inline-flex";
        badge.removeAttribute("hidden");
      } else {
        badge.style.display = "none";
        badge.setAttribute("hidden", "");
      }
    }

    list.innerHTML = filtered.map(renderCard).join("");

    // Wire actions
    /* Handler lihat-pembayaran */
    list.querySelectorAll("[data-action='cek-pembayaran']").forEach(function(btn) {
      btn.addEventListener('click', function() {
        openPayModal(btn.getAttribute('data-id') || '');
      });
    });

    list.querySelectorAll("[data-action='lanjutkan']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        /* Pastikan data pending tersedia sebelum masuk ke payment.html */
        try {
          var existing = JSON.parse(localStorage.getItem("anabulku_pending_payment")) || null;
          /* Kalau pending sudah ada dan id-nya sama, langsung redirect */
          if (!existing || existing.id !== id) {
            /* Cari data booking dari anabulku_bookings, lalu set sebagai pending */
            var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
            var booking = bks.find(function(b) { return b.id === id; });
            if (booking) {
              /* Pastikan namaKlinik tersedia — cari dari mitraKlinik jika belum ada */
              if (!booking.namaKlinik) {
                try {
                  var klinikList = JSON.parse(localStorage.getItem("mitraKlinik")) || [];
                  /* Cari klinik berdasarkan nama dokter */
                  var klinikMatch = klinikList.find(function(k) {
                    return Array.isArray(k.dokters) && k.dokters.some(function(d) {
                      return d.nama === booking.dokter;
                    });
                  });
                  if (klinikMatch) booking = Object.assign({}, booking, { namaKlinik: klinikMatch.namaKlinik });
                } catch(e2) {}
              }
              localStorage.setItem("anabulku_pending_payment", JSON.stringify(booking));
            }
          }
        } catch(e) {}
        location.href = "payment.html";
      });
    });
    list.querySelectorAll("[data-action='cancel-pending']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        if (!confirm("Yakin ingin membatalkan booking ini?")) return;
        var id = btn.getAttribute("data-id");
        try {
          /* Hapus pending payment */
          localStorage.removeItem("anabulku_pending_payment");
          /* Tandai booking sebagai dibatalkan di anabulku_bookings */
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var idx = bks.findIndex(function(b){ return b.id === id; });
          if (idx >= 0) {
            releaseSlotFromMitra(bks[idx]);
            bks[idx].status = "dibatalkan";
            bks[idx].statusPembayaran = "dibatalkan";
          }
          localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        } catch(e){}
        reloadPending();
        render();
      });
    });
    list.querySelectorAll("[data-action='cancel']").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var id = btn.getAttribute("data-id");
        if (!confirm("Yakin ingin membatalkan booking ini?")) return;
        try {
          var bks = JSON.parse(localStorage.getItem("anabulku_bookings")) || [];
          var idx = bks.findIndex(function(b){ return b.id === id; });
          if (idx >= 0) {
            releaseSlotFromMitra(bks[idx]);
            bks[idx].status = "dibatalkan";
            bks[idx].statusPembayaran = "dibatalkan";
          }
          localStorage.setItem("anabulku_bookings", JSON.stringify(bks));
        } catch(e){}
        render();
      });
    });
  }

  /* ── Bebaskan slot di mitraKlinik saat booking dibatalkan ── */
  function releaseSlotFromMitra(booking) {
    try {
      var mitraList = JSON.parse(localStorage.getItem('mitraKlinik')) || [];
      mitraList = mitraList.map(function(klinik) {
        if (!klinik.bookedSlots) return klinik;
        klinik.bookedSlots = klinik.bookedSlots.filter(function(s) {
          return !(
            s.dokter  === booking.dokter  &&
            s.tanggal === booking.tanggal &&
            s.jam     === booking.jam
          );
        });
        return klinik;
      });
      localStorage.setItem('mitraKlinik', JSON.stringify(mitraList));
    } catch(e) {}
  }


  /* ── Modal Pembayaran ── */
  function openPayModal(bookingId) {

    var bks=[];try{bks=JSON.parse(localStorage.getItem('anabulku_bookings'))||[];}catch(e){}

    var b=bks.find(function(x){return x.id===bookingId;});

    /* Fallback 1: coba cari di pending_payment — object tunggal */
    if(!b){
      try{
        var pp=JSON.parse(localStorage.getItem('anabulku_pending_payment'));
        if(pp && !Array.isArray(pp) && pp.id===bookingId) b=pp;
        /* Fallback 2: pending_payment berupa array */
        if(!b && Array.isArray(pp)){
          b=pp.find(function(x){return x.id===bookingId;});
        }
      }catch(e){}
    }

    /* Fallback 3: kalau ID kosong, ambil pending_payment tunggal */
    if(!b && (!bookingId || bookingId==='')){
      try{
        var pp2=JSON.parse(localStorage.getItem('anabulku_pending_payment'));
        if(pp2 && !Array.isArray(pp2)) b=pp2;
      }catch(e){}
    }

    /* Fallback 4: kalau masih tidak ketemu, tampilkan modal "tidak ditemukan" */
    if(!b){
      document.getElementById('payTitle').textContent='Info Pembayaran';
      var elSub0=document.getElementById('payHeadSub');
      if(elSub0) elSub0.textContent='';
      document.getElementById('payBody').innerHTML=
        '<div class="pm-no-metode">'+
          '<div class="pm-no-metode-ico">🔍</div>'+
          '<div class="pm-no-metode-title">Data booking tidak ditemukan</div>'+
          '<div class="pm-no-metode-sub">Data pembayaran untuk booking ini belum tersedia.<br>Coba lakukan booking ulang jika diperlukan.</div>'+
        '</div>';
      document.getElementById('payOverlay').classList.add('open');
      return;
    }

    /* Kalau belum ada metode pembayaran - tampilkan modal info
       agar user tahu harus memilih metode dulu */
    if(!b.metodePembayaran && !b.metode){
      var elSub=document.getElementById('payHeadSub');
      if(elSub) elSub.textContent='Pilih Metode';
      var _b=b;
      document.getElementById('payBody').innerHTML=
        '<div class="pm-no-metode">'+
          '<div class="pm-no-metode-ico">💳</div>'+
          '<div class="pm-no-metode-title">Metode pembayaran belum dipilih</div>'+
          '<div class="pm-no-metode-sub">Silakan pilih metode pembayaran<br>untuk melanjutkan booking ini.</div>'+
          '<button type="button" id="btnGoPayment" class="pm-no-metode-btn">Pilih Metode Pembayaran &#x2192;</button>'+
        '</div>';
      document.getElementById('payOverlay').classList.add('open');
      setTimeout(function(){
        var gbtn=document.getElementById('btnGoPayment');
        if(gbtn) gbtn.addEventListener('click',function(){
          try{localStorage.setItem('anabulku_pending_payment',JSON.stringify(_b));}catch(e){}
          location.href='payment.html';
        });
      },50);
      return;
    }


    var metode=(b.metodePembayaran||b.metode).toLowerCase();

    var statusPay=(b.statusPembayaran||'').toLowerCase();

    var badgeCls=statusPay==='lunas'?'lunas':statusPay==='menunggu_konfirmasi'?'menunggu':'belum';

    var badgeTxt=statusPay==='lunas'?'Lunas':statusPay==='menunggu_konfirmasi'?'Menunggu konfirmasi':'Belum lunas';

    var hargaTxt=b.harga?fmtHarga(b.harga):null;

    var VA={

      bca:{ico:'🔵',name:'BCA Virtual Account',prefix:'70720'},

      bni:{ico:'🟠',name:'BNI Virtual Account',prefix:'98814'},

      bri:{ico:'🔵',name:'BRI Virtual Account',prefix:'26215'},

      mandiri:{ico:'🟡',name:'Mandiri Virtual Account',prefix:'70012'},

      transfer:{ico:'🏦',name:'Transfer Bank',prefix:'88800'}

    };


    /* ── Banner metode pembayaran yang dipilih user ── */
    var metodeIco, metodeNama;
    if(metode==='qris'){
      metodeIco='📱'; metodeNama='QRIS';
    } else if(metode==='cash'){
      metodeIco='💵'; metodeNama='Bayar di Tempat (Cash)';
    } else if(metode==='bca'){
      metodeIco='🔵'; metodeNama='BCA Virtual Account';
    } else if(metode==='bni'){
      metodeIco='🟠'; metodeNama='BNI Virtual Account';
    } else if(metode==='bri'){
      metodeIco='🔵'; metodeNama='BRI Virtual Account';
    } else if(metode==='mandiri'){
      metodeIco='🟡'; metodeNama='Mandiri Virtual Account';
    } else {
      metodeIco='🏦'; metodeNama='Transfer Bank';
    }
    var metodeBannerHtml=
      '<div class="pm-metode-banner">'+
        '<div class="pm-metode-ico-wrap">'+metodeIco+'</div>'+
        '<div class="pm-metode-info">'+
          '<div class="pm-metode-label">Metode Pembayaran</div>'+
          '<div class="pm-metode-name">'+esc(metodeNama)+'</div>'+
        '</div>'+
        '<span class="pm-badge '+badgeCls+'">'+badgeTxt+'</span>'+
      '</div>';


    function genVA(m,id){

      var d=VA[m]||VA['transfer'];

      var suf=id?id.replace(/[^0-9]/g,'').slice(-8).padStart(8,'0'):'00000000';

      return d.prefix+suf;

    }

    var sumHtml=

      '<div class="pm-summary">'+

        '<div class="pm-summary-title">Ringkasan Booking</div>'+

        '<div class="pm-summary-rows">'+

          '<div class="pm-summary-row"><span>Klinik</span><span>'+esc(b.namaKlinik||'—')+'</span></div>'+

          '<div class="pm-summary-row"><span>Dokter</span><span>'+esc(b.dokter||'—')+'</span></div>'+

          '<div class="pm-summary-row"><span>Jadwal</span><span>'+esc(fmtTanggal(b.tanggal))+' '+esc(b.jam||'')+'</span></div>'+

          (hargaTxt?'<div class="pm-summary-row total"><span>Total</span><span>'+hargaTxt+'</span></div>':'')+

        '</div>'+

      '</div>';



    var payHtml = '';

    if(metode==='qris'){

      payHtml=

        '<div class="pm-card">'+

          '<div class="pm-card-head">'+

            '<div class="pm-card-ico">📱</div>'+

            '<div class="pm-card-meta"><div class="pm-card-name">QRIS</div>'+

            '<div class="pm-card-desc">Scan QR dengan aplikasi apapun</div></div>'+

            '<span class="pm-badge '+badgeCls+'">'+badgeTxt+'</span>'+

          '</div>'+

          '<div class="pm-qris-box">'+

            '<div class="pm-qris-wrap"><img src="qris.png" alt="QR Code Pembayaran" style="width:100%;height:100%;object-fit:contain;display:block;"></div>'+

            (hargaTxt?'<div class="pm-qris-amount">'+hargaTxt+'</div>':'')+

            '<div class="pm-qris-label">Scan dengan GoPay, OVO, Dana,<br>m-Banking, atau aplikasi lainnya</div>'+

          '</div>'+

        '</div>';

    } else if(metode==='cash'){

      payHtml=

        '<div class="pm-card">'+

          '<div class="pm-card-head">'+

            '<div class="pm-card-ico cash">💵</div>'+

            '<div class="pm-card-meta"><div class="pm-card-name">Bayar di Tempat</div>'+

            '<div class="pm-card-desc">Bayar tunai saat tiba di klinik</div></div>'+

            '<span class="pm-badge '+badgeCls+'">'+badgeTxt+'</span>'+

          '</div>'+

          '<div class="pm-cash-box">'+

            '<div class="pm-cash-row"><span class="pm-cash-icon">💵</span>Siapkan uang tunai sesuai tagihan</div>'+

            '<div class="pm-cash-row"><span class="pm-cash-icon">🪪</span>Tunjukkan bukti booking saat tiba</div>'+

            '<div class="pm-cash-row"><span class="pm-cash-icon">🏥</span>Bayar di kasir klinik</div>'+

            (hargaTxt?'<div class="pm-cash-row" style="font-weight:800;color:#EA580C;border-color:#FECACA;background:#FFF5F5;"><span class="pm-cash-icon">💰</span>Total: '+hargaTxt+'</div>':'')+

          '</div>'+

        '</div>';

    } else {

      var vk=VA[metode]?metode:'transfer';

      var vi=VA[vk];

      var vn=genVA(vk,b.id);

      payHtml=

        '<div class="pm-card">'+

          '<div class="pm-card-head">'+

            '<div class="pm-card-ico bank">🏦</div>'+

            '<div class="pm-card-meta"><div class="pm-card-name">'+vi.name+'</div>'+

            '<div class="pm-card-desc">Transfer via ATM / Mobile Banking</div></div>'+

            '<span class="pm-badge '+badgeCls+'">'+badgeTxt+'</span>'+

          '</div>'+

          '<div class="pm-va-box">'+

            '<div class="pm-va-bank-row">'+

              '<span class="pm-va-bank-ico">'+vi.ico+'</span>'+

              '<span class="pm-va-bank-name">'+vi.name+'</span>'+

            '</div>'+

            '<div class="pm-va-num-box">'+

              '<span class="pm-va-num">'+vn+'</span>'+

              '<button class="pm-va-copy" type="button" onclick="(function(btn){navigator.clipboard&&navigator.clipboard.writeText(\''+vn+'\');btn.textContent=\'Tersalin!\';setTimeout(function(){btn.textContent=\'Salin\';},1500);})(this)">Salin</button>'+

            '</div>'+

            (hargaTxt?'<div class="pm-va-note">Transfer tepat <strong>'+hargaTxt+'</strong> ke nomor Virtual Account di atas</div>':'')+

            '<div class="pm-va-note">Pembayaran dikonfirmasi otomatis dalam 1×24 jam</div>'+

          '</div>'+

        '</div>';

    }

    var hs=metode==='qris'?'QRIS':metode==='cash'?'Bayar di Tempat':(VA[metode]||VA['transfer']).name;

    var el=document.getElementById('payHeadSub');if(el)el.textContent=hs;

    document.getElementById('payBody').innerHTML=metodeBannerHtml+payHtml+sumHtml;

    document.getElementById('payOverlay').classList.add('open');

  }



    function closePayModal() { document.getElementById('payOverlay').classList.remove('open'); }
  document.getElementById('payClose').addEventListener('click', closePayModal);
  document.getElementById('payCloseBtn').addEventListener('click', closePayModal);
  document.getElementById('payOverlay').addEventListener('click', function(e){ if(e.target===this) closePayModal(); });

  // Hapus semua riwayat
  document.getElementById("btnClearAll").addEventListener("click", function() {
    if (!confirm("Hapus semua riwayat booking? Tindakan ini tidak bisa dibatalkan.")) return;
    try {
      localStorage.removeItem("anabulku_bookings");
      localStorage.removeItem("anabulku_pending_payment");
    } catch(e) {}
    render();
  });

  // Filter bar
  document.getElementById("filterBar").addEventListener("click", function(e) {
    var btn = e.target.closest(".filter-chip");
    if (!btn) return;
    document.querySelectorAll(".filter-chip").forEach(function(b){
      b.classList.remove("active"); b.setAttribute("aria-selected","false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected","true");
    currentFilter = btn.getAttribute("data-filter");
    render();
  });

  render();

  /* Live countdown - update timer pill setiap detik */
  setInterval(function() {
    document.querySelectorAll('.card-timer[data-deadline]').forEach(function(el) {
      var dl=new Date(el.getAttribute('data-deadline')).getTime();
      var rem=Math.max(0,dl-Date.now());
      var sec=Math.ceil(rem/1000);
      var tm=Math.floor(sec/60),ts=sec%60;
      var sp=el.querySelector('span');
      if(sp) sp.textContent=(tm<10?'0':'')+tm+':'+(ts<10?'0':'')+ts;
      if(rem<=60000){el.classList.add('urgent');}else{el.classList.remove('urgent');}
      if(rem<=0){ cancelExpiredBookings(); render(); }
    });
    /* Update urgent state pada info bar secara real-time */
    document.querySelectorAll('.pending-info-bar[data-deadline-bar]').forEach(function(el) {
      var dl=new Date(el.getAttribute('data-deadline-bar')).getTime();
      var rem=Math.max(0,dl-Date.now());
      if(rem<=60000){el.classList.add('urgent');}else{el.classList.remove('urgent');}
    });
  },1000);

  /* Handle BFCache — re-render saat halaman di-restore dari cache browser */
  window.addEventListener("pageshow", function(e) {
    if (e.persisted) render();
  });
})();
</script>
</body>
</html>
