<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>AnabulKu — Beranda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <div class="user">
        <span class="avatar" aria-hidden="true" id="userAvatar"></span>
        <span class="user-text">
          <span class="welcome">Halo <span class="emoji">👋</span></span>
          <span class="username" id="userGreeting"></span>
        </span>
      </div>

      <div class="actions">
        <button class="act-btn" type="button" aria-label="Cari">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="9" r="6" />
            <line x1="17.5" y1="17.5" x2="13.2" y2="13.2" />
          </svg>
        </button>
        <button class="act-btn" type="button" aria-label="Notifikasi">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 7.5a5 5 0 0 0-10 0c0 5.8-2.5 7.5-2.5 7.5h15S15 13.3 15 7.5" />
            <path d="M11.25 17.5a1.25 1.25 0 0 1-2.5 0" />
          </svg>
          <span class="badge" aria-hidden="true"></span>
        </button>
        <button class="act-btn" type="button" id="btnLogout" aria-label="Keluar">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 6.5 17 10l-3.5 3.5M17 10H7.5M7.5 3.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== Hero banner ===== -->
    <section class="hero" aria-label="Promosi">
      <span class="hero-texture" aria-hidden="true"></span>
      <span class="hero-glow hero-glow-1" aria-hidden="true"></span>
      <span class="hero-glow hero-glow-2" aria-hidden="true"></span>
      <div class="hero-text">
        <h1 class="hero-title">Perawatan Ada<br>di Dekatmu</h1>
        <p class="hero-sub">Klinik hewan & grooming terpercaya untuk si berbulu.</p>
        <button class="hero-cta" type="button" onclick="document.querySelector('.category-grid').scrollIntoView({behavior:'smooth'})">
          Mulai Cari
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
        </button>
      </div>
      <img class="hero-pet" src="anjing%20Kucing.png" alt="Anjing dan kucing memakai topi dan kacamata" />
    </section>


    <div class="dots" role="tablist" aria-label="Slide">
      <span class="dot active" role="tab" aria-selected="true" aria-label="Slide 1"></span>
      <span class="dot" role="tab" aria-label="Slide 2"></span>
      <span class="dot" role="tab" aria-label="Slide 3"></span>
    </div>

    <!-- ===== Kategori Klinik ===== -->
    <section class="section" aria-labelledby="klinik-title">
      <h2 class="section-title" id="klinik-title">Kategori Klinik</h2>
      <div class="category-grid">
        <button class="cat" type="button" data-category="kucing">
          <span class="cat-tile"><img class="cat-ico" src="cat%20icon.png" alt="" aria-hidden="true" /></span>
          <span class="cat-label">Kucing</span>
        </button>
        <button class="cat" type="button" data-category="anjing">
          <span class="cat-tile"><img class="cat-ico" src="anjing.png" alt="" aria-hidden="true" /></span>
          <span class="cat-label">Anjing</span>

        </button>
        <button class="cat" type="button" data-category="reptile">
          <span class="cat-tile"><img class="cat-ico cat-ico-turtle" src="turtle%20icon.png" alt="" aria-hidden="true" /></span>
          <span class="cat-label">Reptile</span>

        </button>
        <button class="cat" type="button" data-category="terdekat">
          <span class="cat-tile"><img class="cat-ico" src="lokasi%20icon.png" alt="" aria-hidden="true" /></span>
          <span class="cat-label">Terdekat</span>
        </button>
      </div>
    </section>

    <!-- ===== Hasil pencarian klinik (Google Maps) ===== -->
    <section class="section clinic-results" id="clinic-results" hidden aria-live="polite">
      <h2 class="section-title" id="clinic-results-title">Klinik Terdekat</h2>
      <div class="clinic-list" id="clinic-list"></div>
      <p class="clinic-note" id="clinic-note"></p>
    </section>

    <!-- ===== Kategori Grooming ===== -->
    <section class="section" aria-labelledby="grooming-title">
      <h2 class="section-title" id="grooming-title">Kategori Grooming</h2>
      <div class="grooming-grid">
        <button class="g-card" type="button" data-grooming="kucing" aria-label="Grooming Kucing">
          <h3 class="g-title">Grooming Kucing</h3>
          <img class="g-img g-img-cat" src="kucing.png" alt="Kucing memakai kacamata" />
        </button>
        <button class="g-card" type="button" data-grooming="anjing" aria-label="Grooming Anjing">
          <h3 class="g-title">Grooming Anjing</h3>
          <img class="g-img g-img-dog" src="anjingroom.png" alt="Anjing memakai kacamata" />
        </button>
      </div>

      <!-- Hasil grooming — ditampilkan saat card diklik -->
      <div id="grooming-results" hidden aria-live="polite">
        <div class="grooming-results-header">
          <h3 class="grooming-results-title" id="grooming-results-title"></h3>
          <span class="grooming-results-note" id="grooming-note"></span>
        </div>
        <div id="grooming-list"></div>
      </div>
    </section>

    <div class="nav-spacer" aria-hidden="true"></div>

    <!-- ===== Modal Guest ===== -->
    <div id="guestModal" class="guest-modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="guestModalTitle">
      <div class="guest-modal">
        <button class="guest-modal-close" id="guestModalClose" aria-label="Tutup">&times;</button>
        <div class="guest-modal-icon">🔒</div>
        <h2 class="guest-modal-title" id="guestModalTitle">Login Diperlukan</h2>
        <p class="guest-modal-desc">Fitur ini hanya tersedia untuk member AnabulKu. Login atau daftar gratis sekarang!</p>
        <button class="guest-modal-btn guest-modal-btn--primary" id="guestModalLogin">Masuk</button>
        <button class="guest-modal-btn guest-modal-btn--secondary" id="guestModalRegister">Daftar Gratis</button>
      </div>
    </div>

    <!-- ===== Bottom navigation ===== -->
    <nav class="bottomnav" aria-label="Navigasi utama">
      <button class="nav-btn is-active" type="button" aria-label="Beranda" aria-current="page" id="navHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 2.4 11.1a1 1 0 0 0 .65 1.76H4.5V20a1 1 0 0 0 1 1H9.5v-5.5h5V21H18.5a1 1 0 0 0 1-1v-7.14h1.45a1 1 0 0 0 .65-1.76L12 3z" />
        </svg>
        <span class="nav-label">Beranda</span>
      </button>
      <button class="nav-btn" type="button" aria-label="Riwayat Booking" id="navRiwayat" onclick="location.href='riwayat.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8v4l3 3"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
        <span class="nav-label">Riwayat</span>
      </button>
      <button class="nav-btn" type="button" aria-label="Favorit" id="navFavorit" onclick="location.href='favorit.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
        </svg>
        <span class="nav-label">Favorit</span>
      </button>
      <button class="nav-btn" type="button" aria-label="Profil" id="navProfil" onclick="location.href='profil.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M5 20a7 7 0 0 1 14 0" />
        </svg>
        <span class="nav-label">Profil</span>
      </button>
    </nav>

  </div>

  <script src="config.js"></script>
  <script src="clinics.js"></script>
  <script src="notif.js"></script>
  <script>
  (function () {
    'use strict';
    const LS = {
      get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    };

    const session = LS.get('anabulku_user_session', {});
    const isGuest = !session || !session.loggedIn;

    /* Topbar — tampilkan nama atau "Tamu" */
    const username = isGuest ? 'Meng' : (session.username || session.nama || 'Pengguna');
    const inisial  = isGuest ? '👤' : username.slice(0, 2).toUpperCase();
    const avatarEl   = document.getElementById('userAvatar');
    const greetingEl = document.getElementById('userGreeting');
    if (avatarEl)   avatarEl.textContent   = inisial;
    if (greetingEl) greetingEl.textContent = username;

    /* Tombol logout — sembunyikan jika guest */
    const btnLogout = document.getElementById('btnLogout');
    if (btnLogout) {
      if (isGuest) {
        btnLogout.style.display = 'none';
      } else {
        btnLogout.addEventListener('click', () => {
          localStorage.removeItem('anabulku_user_session');
          localStorage.removeItem('anabulku_user_remember');
          window.location.replace('home.html');
        });
      }
    }

    /* ── Modal login untuk guest ── */
    function showLoginModal() {
      document.getElementById('guestModal').removeAttribute('hidden');
    }
    document.getElementById('guestModalClose').addEventListener('click', () => {
      document.getElementById('guestModal').setAttribute('hidden', '');
    });
    document.getElementById('guestModalLogin').addEventListener('click', () => {
      window.location.href = 'login.html';
    });
    document.getElementById('guestModalRegister').addEventListener('click', () => {
      window.location.href = 'register.html';
    });
    /* Tutup modal saat klik backdrop */
    document.getElementById('guestModal').addEventListener('click', function(e) {
      if (e.target === this) this.setAttribute('hidden', '');
    });

    /* Grooming dan klinik sama-sama bebas diakses — intercept booking ada di clinic-detail.html */
    if (typeof window._anabulkuInitGrooming === 'function') {
      window._anabulkuInitGrooming();
    }
  })();
  </script>
</body>
</html>
