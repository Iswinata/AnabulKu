<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: "Poppins", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      background-attachment: fixed;
    }

    /* ── App shell ── */
    .splash {
      position: relative;
      width: 100%;
      max-width: 393px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
      animation: bgReveal .6s ease both;
    }

    @keyframes bgReveal {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── Decorative glow orbs ── */
    .blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }
    .blob-1 { width: 260px; height: 260px; top: -80px;  left: -80px;  background: rgba(255,152,0,0.25); }
    .blob-2 { width: 200px; height: 200px; bottom: 60px; right: -60px; background: rgba(120,80,255,0.20); }
    .blob-3 { width: 120px; height: 120px; top: 38%;    right: 30px;  background: rgba(255,189,93,0.15); }

    /* ── Glassmorphism inner card ── */
    .splash-glass {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 32px;
      padding: 48px 40px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    /* ── Center content ── */
    .center {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      z-index: 1;
    }

    /* ── Icon kucing ── */
    .cat-icon {
      font-size: 88px;
      line-height: 1;
      filter: drop-shadow(0 8px 20px rgba(255,152,0,0.5));
      animation: catBounce .7s cubic-bezier(.36,.07,.19,.97) .3s both;
      transform-origin: bottom center;
    }

    @keyframes catBounce {
      0%   { opacity: 0; transform: translateY(-60px) scale(.6); }
      60%  { opacity: 1; transform: translateY(10px)  scale(1.08); }
      80%  { transform: translateY(-6px) scale(.97); }
      100% { opacity: 1; transform: translateY(0)     scale(1); }
    }

    /* ── App name ── */
    .app-name {
      margin-top: 18px;
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 4px 20px rgba(255,152,0,0.4);
      animation: nameFade .5s ease .9s both;
    }

    @keyframes nameFade {
      from { opacity: 0; transform: scale(.85) translateY(10px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    /* ── Tagline ── */
    .tagline {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,.70);
      letter-spacing: .3px;
      animation: tagFade .5s ease 1.2s both;
    }

    @keyframes tagFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Loading dots ── */
    .dots {
      margin-top: 40px;
      display: flex;
      gap: 8px;
      animation: tagFade .4s ease 1.5s both;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,152,0,.5);
    }
    .dot:nth-child(1) { animation: dotPulse 1s ease 1.7s infinite; }
    .dot:nth-child(2) { animation: dotPulse 1s ease 1.9s infinite; }
    .dot:nth-child(3) { animation: dotPulse 1s ease 2.1s infinite; }

    @keyframes dotPulse {
      0%, 100% { opacity: .35; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.35); background: #ff9800; }
    }

    /* ── Bottom brand strip ── */
    .brand-strip {
      position: absolute;
      bottom: 32px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,.35);
      letter-spacing: .5px;
      animation: tagFade .4s ease 1.6s both;
      z-index: 2;
    }

    /* ── Fade-out sebelum redirect ── */
    .splash.fade-out {
      animation: fadeOut .45s ease forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  </style>
  <link rel="stylesheet" href="glass-theme.css" />
</head>
<body>
  <div class="splash" id="splash" role="main" aria-label="Memuat AnabulKu">

    <!-- Dekorasi blob -->
    <span class="blob blob-1" aria-hidden="true"></span>
    <span class="blob blob-2" aria-hidden="true"></span>
    <span class="blob blob-3" aria-hidden="true"></span>

    <!-- Konten utama -->
    <div class="center">
      <span class="cat-icon" role="img" aria-label="Ikon kucing">🐱</span>
      <span class="app-name">AnabulKu</span>
      <span class="tagline">Sahabat setia hewan peliharaanmu 🐾</span>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <span class="brand-strip">© 2025 AnabulKu</span>
  </div>

  <script>
  (function () {
    'use strict';

    /* Selalu ke home — guest mode dihandle di home.html */
    var SPLASH_DURATION = 2800;

    setTimeout(function () {
      var el = document.getElementById('splash');
      el.classList.add('fade-out');
      setTimeout(function () {
        window.location.replace('home.html');
      }, 450);
    }, SPLASH_DURATION);
  })();
  </script>
</body>
</html>
