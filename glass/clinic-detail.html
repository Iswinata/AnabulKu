<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>Detail Klinik – AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="clinic-detail.css" />
  <link rel="stylesheet" href="glass-theme.css" />
</head>
<body>
  <div class="app cd-app">

    <header class="topbar">
      <div class="user">
        <span class="avatar" aria-hidden="true" id="userAvatar"></span>
        <span class="user-text">
          <span class="welcome">Halo <span class="emoji">&#128075;</span></span>
          <span class="username" id="userGreeting"></span>
        </span>
      </div>
      <div class="actions">
        <button class="act-btn" type="button" aria-label="Cari">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><line x1="17.5" y1="17.5" x2="13.2" y2="13.2"/></svg>
        </button>
        <button class="act-btn" type="button" aria-label="Notifikasi">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.667" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 7.5a5 5 0 0 0-10 0c0 5.8-2.5 7.5-2.5 7.5h15S15 13.3 15 7.5"/><path d="M11.25 17.5a1.25 1.25 0 0 1-2.5 0"/></svg>
          <span class="badge" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="cd-scroll">

      <div class="cd-back-row">
        <button class="cd-btn-back" type="button" aria-label="Kembali" onclick="history.back()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="cd-back-title">Detail Klinik</span>
      </div>

      <section class="cd-main-card" id="cdMainCard" aria-label="Informasi klinik">
        <span class="cd-main-photo" id="cdPhoto" aria-hidden="true"></span>
        <div class="cd-main-body">
          <p class="cd-main-name" id="cdName">—</p>
          <p class="cd-main-addr" id="cdAddr">—</p>
          <div class="cd-main-meta">
            <span class="cd-meta-chip"><svg class="cd-meta-ico" viewBox="0 0 24 24"><path fill="#FFDEAE" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg><span class="cd-meta-val" id="cdDist">—</span></span>
            <span class="cd-meta-chip"><svg class="cd-meta-ico" viewBox="0 0 24 24"><path fill="#FFDEAE" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span class="cd-meta-val" id="cdRating">4.8</span></span>
          </div>
        </div>
      </section>

      <section class="cd-date-section"><div class="cd-section-header"><h2 class="cd-section-title">Pilih Tanggal</h2></div><div class="cd-date-strip" id="cdDateStrip" role="group"></div></section>

      <section class="cd-doctor-section" id="cdDoctors"><div class="cd-section-header"><h2 class="cd-section-title">Dokter Tersedia</h2></div></section>

    </div>

    <nav class="bottomnav">
      <button class="nav-btn" type="button" onclick="window.location.href='home.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Beranda</span></button>
      <button class="nav-btn" type="button" onclick="window.location.href='riwayat.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="nav-label">Riwayat</span></button>
      <button class="nav-btn" type="button" onclick="window.location.href='favorit.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="nav-label">Favorit</span></button>
      <button class="nav-btn" type="button" onclick="window.location.href='profil.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span class="nav-label">Profil</span></button>
    </nav>

  </div>

  <script>
  (function(){
    var s={};try{s=JSON.parse(localStorage.getItem("anabulku_user_session"))||{};}catch(e){}
    var g=!s.loggedIn,u=g?"Meng":(s.username||s.nama||"Pengguna");
    var ini=g?String.fromCodePoint(0x1F464):u.slice(0,2).toUpperCase();
    var a=document.getElementById("userAvatar"),b=document.getElementById("userGreeting");
    if(a)a.textContent=ini;if(b)b.textContent=u;
  })();
  </script>
  <script src="notif.js"></script>
  <script src="clinic-detail.js"></script>
</body>
</html>
