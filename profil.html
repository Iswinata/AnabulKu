<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCECE3" />
  <title>Profil — AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: "Poppins", system-ui, sans-serif; background: #e7dbd0; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
    body { display: flex; justify-content: center; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; background: none; }
    a { text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent; }
    .app { position: relative; width: 100%; max-width: 393px; min-height: 100dvh; background: #f5ebe0; box-shadow: 0 0 40px -10px rgba(0,0,0,.2); display: flex; flex-direction: column; padding: 0; }
    .header { background: #fcece3; padding: 20px 22px 14px; flex-shrink: 0; }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .header-text { min-width: 0; }
    .header-title { font-size: 14px; font-weight: 700; color: #1F2937; line-height: 1.3; }
    .header-sub { font-size: 12px; color: #9CA3AF; font-weight: 400; line-height: 1.4; margin-top: 1px; }
    .content { flex: 1; overflow-y: auto; padding: 28px 20px 100px; display: flex; flex-direction: column; gap: 28px; }
    .content::-webkit-scrollbar { width: 0; }
    .profile-card {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border-radius: 14px;
      border: 1.5px solid #fed7aa;
      box-shadow: 2px 2px 0 #000;
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: transform 0.1s ease;
    }
    .av {
      width: 58px; height: 58px; border-radius: 9999px; flex-shrink: 0;
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(255,87,34,.35);
      border: 2px solid #fed7aa;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px;
      user-select: none;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 15px; font-weight: 700; color: #92400e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-email { font-size: 11px; color: #b45309; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-member { font-size: 13px; font-weight: 800; color: #92400e; margin-top: 6px; }
    .profile-since { font-size: 10.5px; font-weight: 500; color: #b45309; margin-top: 2px; }
    .app-version {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 0 4px;
    }
    .app-version-ico { font-size: 32px; line-height: 1; }
    .app-version-name { font-size: 13px; font-weight: 700; color: #92400e; }
    .app-version-num { font-size: 11px; color: #b45309; font-weight: 400; }
    .sect-lbl { font-size: 12.7847px; font-weight: 600; color: #ac6600; line-height: 20px; padding: 0 2px; margin-top: 20px; margin-bottom: 8px; display: block; }
    .menu-group { background: #fff; border-radius: 14px; border: 1.5px solid #f0e6dc; box-shadow: 2px 2px 0 #000; overflow: hidden; }
    .mi { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #faf3ee; width: 100%; text-align: left; transition: background .12s; }
    .mi:last-child { border-bottom: none; }
    .mi:active { background: #fdf5f0; }
    .mi-ico { width: 34px; height: 34px; border-radius: 10px; background: #fff5ee; border: 1px solid #fde8c8; display: grid; place-items: center; flex-shrink: 0; color: #FF5722; }
    .mi-ico svg { width: 16px; height: 16px; }
    .mi-body { flex: 1; }
    .mi-title { font-size: 13px; font-weight: 600; color: #1F2937; }
    .mi-sub { font-size: 11px; color: #9CA3AF; margin-top: 1px; }
    .mi-arr { color: #D1D5DB; flex-shrink: 0; }
    .mi-arr svg { width: 15px; height: 15px; }
    .mi-red .mi-ico { background: #FEF2F2; border-color: #fecaca; color: #EF4444; }
    .mi-red .mi-title { color: #EF4444; }

  </style>
</head>
<body>
<div class="app">

  <div class="content">

    <!-- ===== Tampilan Guest (hidden by default) ===== -->
    <div id="profileGuest" hidden style="display:flex;flex-direction:column;gap:24px;">
      <div class="guest-profile-card">
        <div class="guest-avatar"><img src="kuguest.jpg" alt="Foto profil tamu" style="width:100%;height:100%;object-fit:cover;border-radius:9999px;" /></div>
        <div class="guest-name">Halo, Meng!</div>
        <div class="guest-desc">Login atau daftar untuk mengakses semua fitur AnabulKu — booking, favorit, dan riwayat layanan hewan peliharaanmu.</div>
        <div class="guest-btn-row">
          <button class="guest-btn guest-btn--primary" type="button" id="btnGuestLogin">Masuk</button>
          <button class="guest-btn guest-btn--secondary" type="button" id="btnGuestRegister">Daftar</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div class="sect-lbl">Tentang Aplikasi</div>
        <div class="menu-group">
        <button class="mi" type="button">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
          <div class="mi-body"><div class="mi-title">Bantuan</div><div class="mi-sub">Pusat bantuan &amp; FAQ</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        </div>
      </div>
    </div>

    <!-- ===== Tampilan Member ===== -->
    <div id="profileMember">
      <div class="profile-card" id="profileLoggedIn">
        <div class="av" id="avatarEl"></div>
        <div class="profile-info">
          <div class="profile-name" id="nameEl">Nama Pengguna</div>
          <div class="profile-email" id="emailEl">email@contoh.com</div>
          <div class="profile-member">&#128062; Member AnabulKu</div>
          <div class="profile-since" id="joinEl">Bergabung sejak —</div>
        </div>
      </div>
      <div class="sect-lbl">Aktivitas</div>
      <div class="menu-group">
        <button class="mi" type="button" onclick="location.href='riwayat.html'">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></div>
          <div class="mi-body"><div class="mi-title">Riwayat Booking</div><div class="mi-sub">Lihat semua riwayat booking</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        <button class="mi" type="button" onclick="location.href='favorit.html'">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
          <div class="mi-body"><div class="mi-title">Klinik Favorit</div><div class="mi-sub">Klinik yang kamu simpan</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
      </div>
      <div class="sect-lbl">Lainnya</div>
      <div class="menu-group">
        <button class="mi" type="button">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
          <div class="mi-body"><div class="mi-title">Bantuan</div><div class="mi-sub">Pusat bantuan &amp; FAQ</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        <button class="mi mi-red" type="button" id="btnLogout">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
          <div class="mi-body"><div class="mi-title">Keluar dari Akun</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
      </div>
    </div>

    <div class="app-version" aria-label="Versi aplikasi">
      <span class="app-version-ico">🐱</span>
      <span class="app-version-name">AnabulKu</span>
      <span class="app-version-num">Versi 1.0.0</span>
    </div>
  </div>
  <nav class="bottomnav" aria-label="Navigasi utama">
    <button class="nav-btn" type="button" aria-label="Beranda" onclick="location.href='home.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.4 11.1a1 1 0 0 0 .65 1.76H4.5V20a1 1 0 0 0 1 1H9.5v-5.5h5V21H18.5a1 1 0 0 0 1-1v-7.14h1.45a1 1 0 0 0 .65-1.76L12 3z"/></svg><span class="nav-label">Beranda</span></button>
    <button class="nav-btn" type="button" aria-label="Riwayat" onclick="location.href='riwayat.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg><span class="nav-label">Riwayat</span></button>
    <button class="nav-btn" type="button" aria-label="Favorit" onclick="location.href='favorit.html'"><svg viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="nav-label">Favorit</span></button>
    <button class="nav-btn active" type="button" aria-label="Profil" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span class="nav-label">Profil</span></button>
  </nav>
</div>
<script>
(function () {
  "use strict";
  var s = {};
  try { s = JSON.parse(localStorage.getItem("anabulku_user_session")) || {}; } catch (e) {}
  var isGuest = !s.loggedIn;

  if (isGuest) {
    /* ── Tampilan Guest ── */
    document.getElementById("profileMember").style.display = "none";
    document.getElementById("profileLoggedIn").style.display = "none";
    document.getElementById("profileGuest").removeAttribute("hidden");
    document.getElementById("btnGuestLogin").addEventListener("click", function() {
      window.location.href = "login.html";
    });
    document.getElementById("btnGuestRegister").addEventListener("click", function() {
      window.location.href = "register.html";
    });
    return;
  }

  /* ── Tampilan Member ── */
  var un  = s.username || s.nama || "Pengguna";
  var em  = s.email || "-";
  var ini = (s.username || s.nama || "A").trim().charAt(0).toUpperCase();
  document.getElementById("avatarEl").textContent = ini;
  document.getElementById("nameEl").textContent   = un;
  document.getElementById("emailEl").textContent  = em;
  try {
    var raw = s.createdAt || s.registeredAt || s.joinDate || null;
    if (!raw) {
      try {
        var users = JSON.parse(localStorage.getItem("anabulku_users")) || [];
        var found = users.find(function(u){ return u.email === s.email || u.username === s.username; });
        if (found) raw = found.createdAt || found.registeredAt || null;
      } catch(e2) {}
    }
    if (raw) {
      var d = new Date(raw);
      var bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      document.getElementById("joinEl").textContent = "Bergabung sejak " + d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
    } else {
      document.getElementById("joinEl").textContent = "Bergabung sejak —";
    }
  } catch(e) {
    document.getElementById("joinEl").textContent = "Bergabung sejak —";
  }
  document.getElementById("btnLogout").addEventListener("click", function() {
    if (confirm("Yakin mau keluar dari akun?")) {
      localStorage.removeItem("anabulku_user_session");
      localStorage.removeItem("anabulku_user_remember");
      window.location.replace("home.html");
    }
  });
})();
</script>
</body>
</html>
