<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <title>Profil — AnabulKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: "Poppins", system-ui, sans-serif; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
    body { display: flex; justify-content: center; }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; background: none; }
    a { text-decoration: none; color: inherit; -webkit-tap-highlight-color: transparent; }
    .app { position: relative; width: 100%; max-width: 393px; min-height: 100dvh; display: flex; flex-direction: column; padding: 0; }
    .header { background: rgba(255,255,255,0.06); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,0.10); padding: 20px 22px 14px; flex-shrink: 0; }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .header-text { min-width: 0; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.3; }
    .header-sub { font-size: 12px; color: rgba(255,255,255,0.45); font-weight: 400; line-height: 1.4; margin-top: 1px; }
    .content { flex: 1; overflow-y: auto; padding: 20px 20px 100px; display: flex; flex-direction: column; gap: 10px; }
    .content::-webkit-scrollbar { width: 0; }
    .profile-card {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.20);
      padding: 20px 18px;
      display: flex; align-items: center; gap: 14px;
    }
    .av {
      width: 58px; height: 58px; border-radius: 9999px; flex-shrink: 0;
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(255,152,0,0.40);
      border: 2px solid rgba(255,189,93,0.50);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px; user-select: none;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-email { font-size: 11px; color: rgba(255,255,255,0.50); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-member { font-size: 13px; font-weight: 800; color: #ffbd5d; margin-top: 6px; }
    .profile-since { font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .app-version { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 4px; }
    .app-version-ico { font-size: 32px; line-height: 1; }
    .app-version-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.80); }
    .app-version-num { font-size: 11px; color: rgba(255,255,255,0.40); font-weight: 400; }
    .sect-lbl { font-size: 11px; font-weight: 700; color: #ffbd5d; text-transform: uppercase; letter-spacing: .07em; margin-top: 8px; margin-bottom: 6px; padding-left: 2px; }
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      text-decoration: none; color: #fff;
    }
    .menu-item:hover { background: rgba(255,255,255,0.13); }
    .menu-item:active { transform: scale(.98); }
    .menu-item-icon {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .menu-item-text { flex: 1; min-width: 0; }
    .menu-item-label { font-size: 13px; font-weight: 600; color: #fff; }
    .menu-item-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .menu-item-arrow { color: rgba(255,255,255,0.30); flex-shrink: 0; }
    .menu-item-arrow svg { width: 16px; height: 16px; }
    .menu-item--danger .menu-item-label { color: #fca5a5; }
    .menu-item--danger { border-color: rgba(239,68,68,0.20); }
    .menu-item--danger:active { background: rgba(239,68,68,0.10); }
    .nav-label { font-size: 9.5px; font-weight: 600; }
    @media (prefers-reduced-motion:reduce) { *{transition:none!important;} }
    .menu-group {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 18px; border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18); overflow: hidden;
    }
    .mi {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
      width: 100%; text-align: left; transition: background .12s; color: #fff;
    }
    .mi:last-child { border-bottom: none; }
    .mi:hover { background: rgba(255,255,255,0.06); }
    .mi:active { background: rgba(255,255,255,0.10); }
    .mi-ico {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255,152,0,0.18); border: 1px solid rgba(255,152,0,0.30);
      display: grid; place-items: center; flex-shrink: 0; color: #ffbd5d;
    }
    .mi-ico svg { width: 16px; height: 16px; }
    .mi-body { flex: 1; }
    .mi-title { font-size: 13px; font-weight: 600; color: #fff; }
    .mi-sub { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .mi-arr { color: rgba(255,255,255,0.25); flex-shrink: 0; }
    .mi-arr svg { width: 15px; height: 15px; }
    .mi-red .mi-ico { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.30); color: #fca5a5; }
    .mi-red .mi-title { color: #fca5a5; }

    /* ===== Guest View ===== */
    .guest-view {
      display: flex; flex-direction: column; align-items: center;
      padding: 36px 20px 28px; gap: 0;
    }
    .guest-avatar {
      width: 88px; height: 88px; border-radius: 9999px; flex-shrink: 0;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.30);
      background: rgba(255,255,255,0.08);
      margin-bottom: 18px;
    }
    .guest-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .guest-title { font-size: 17px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 8px; }
    .guest-desc { font-size: 12.5px; color: rgba(255,255,255,0.50); text-align: center; line-height: 1.6; max-width: 260px; margin-bottom: 28px; }
    .guest-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    .guest-btn {
      width: 100%; padding: 13px 20px;
      border-radius: 14px; font-size: 14px; font-weight: 700;
      cursor: pointer; border: none; font-family: inherit;
      transition: transform .12s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .guest-btn:active { transform: scale(.97); }
    .guest-btn--login {
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,152,0,0.35);
    }
    .guest-btn--register {
      background: rgba(255,255,255,0.09);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
    }

    /* ===== App Version Info ===== */
    .app-version {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; padding: 24px 16px 8px;
    }
    .app-version-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.55); }
    .app-version-num  { font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.30); }
    .app-version-pow  { font-size: 10px; font-weight: 400; color: rgba(255,255,255,0.22); }

  </style>
</head>
<body>
<div class="app">

  <div class="content">



    <!-- ===== Tampilan Guest ===== -->
    <div id="profileGuest" hidden>
      <div class="guest-view">
        <div class="guest-avatar">
          <img src="kuguest.png" alt="Foto profil tamu" />
        </div>
        <div class="guest-title">Halo, Meng! 👋</div>
        <div class="guest-desc">Masuk atau daftar untuk menikmati fitur lengkap AnabulKu — booking, favorit, dan riwayat perawatan anabulmu.</div>
        <div class="guest-actions">
          <button class="guest-btn guest-btn--login" type="button" onclick="location.href='login.html'">Masuk</button>
          <button class="guest-btn guest-btn--register" type="button" onclick="location.href='register.html'">Daftar Akun Baru</button>
        </div>
        <div class="app-version">
          <span class="app-version-name">Vetiloka</span>
          <span class="app-version-num">versi 1.0</span>
          <span class="app-version-pow">Powered by Appiloka 2020</span>
        </div>
      </div>
    </div>

    <!-- ===== Tampilan Member ===== -->
    <div id="profileMember" hidden>
      <div class="profile-card" id="profileLoggedIn">
        <div class="av" id="avatarEl"></div>
        <div class="profile-info">
          <div class="profile-name" id="nameEl">Nama Pengguna</div>
          <div class="profile-email" id="emailEl">email@contoh.com</div>
          <div class="profile-member">&#128062; Member AnabulKu</div>
          <div class="profile-since" id="joinEl">Bergabung sejak —</div>
        </div>
      </div>
      <div class="sect-lbl">Aktivitas</div>
      <div class="menu-group">
        <button class="mi" type="button" onclick="location.href='riwayat.html'">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></div>
          <div class="mi-body"><div class="mi-title">Riwayat Booking</div><div class="mi-sub">Lihat semua riwayat booking</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        <button class="mi" type="button" onclick="location.href='favorit.html'">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
          <div class="mi-body"><div class="mi-title">Klinik Favorit</div><div class="mi-sub">Klinik yang kamu simpan</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
      </div>
      <div class="sect-lbl" style="margin-top:20px">Lainnya</div>
      <div class="menu-group">
        <button class="mi" type="button">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
          <div class="mi-body"><div class="mi-title">Bantuan</div><div class="mi-sub">Pusat bantuan &amp; FAQ</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
        <button class="mi mi-red" type="button" id="btnLogout">
          <div class="mi-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
          <div class="mi-body"><div class="mi-title">Keluar dari Akun</div></div>
          <div class="mi-arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></div>
        </button>
      </div>
      <div class="app-version">
        <span class="app-version-name">Vetiloka</span>
        <span class="app-version-num">versi 1.0</span>
        <span class="app-version-pow">Powered by Appiloka 2020</span>
      </div>
    </div>

  <nav class="bottomnav" aria-label="Navigasi utama">
    <button class="nav-btn" type="button" aria-label="Beranda" onclick="location.href='home.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.4 11.1a1 1 0 0 0 .65 1.76H4.5V20a1 1 0 0 0 1 1H9.5v-5.5h5V21H18.5a1 1 0 0 0 1-1v-7.14h1.45a1 1 0 0 0 .65-1.76L12 3z"/></svg><span class="nav-label">Beranda</span></button>
    <button class="nav-btn" id="navRiwayat" type="button" aria-label="Riwayat" onclick="location.href='riwayat.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg><span class="nav-label">Riwayat</span></button>
    <button class="nav-btn" type="button" aria-label="Favorit" onclick="location.href='favorit.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span class="nav-label">Favorit</span></button>
    <button class="nav-btn is-active" type="button" aria-label="Profil" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span class="nav-label">Profil</span></button>
  </nav>
</div>
<script src="notif.js"></script>
<script>
(function () {
  "use strict";
  var s = null;
  try { s = JSON.parse(localStorage.getItem("anabulku_user_session")); } catch (e) {}

  /* ── Guest: tidak ada session ── */
  if (!s || (!s.username && !s.nama && !s.email)) {
    document.getElementById("profileGuest").removeAttribute("hidden");
    return;
  }

  /* ── Member: ada session ── */
  document.getElementById("profileMember").removeAttribute("hidden");
  var un  = s.username || s.nama || "Pengguna";
  var em  = s.email || "-";
  var ini = (s.username || s.nama || "A").trim().charAt(0).toUpperCase();
  document.getElementById("avatarEl").textContent = ini;
  document.getElementById("nameEl").textContent   = un;
  document.getElementById("emailEl").textContent  = em;
  try {
    var raw = s.createdAt || s.registeredAt || s.joinDate || null;
    if (!raw) {
      try {
        var users = JSON.parse(localStorage.getItem("anabulku_users")) || [];
        var found = users.find(function(u){ return u.email === s.email || u.username === s.username; });
        if (found) raw = found.createdAt || found.registeredAt || null;
      } catch(e2) {}
    }
    if (raw) {
      var d = new Date(raw);
      var bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
      document.getElementById("joinEl").textContent = "Bergabung sejak " + d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
    } else {
      document.getElementById("joinEl").textContent = "Bergabung sejak —";
    }
  } catch(e) {
    document.getElementById("joinEl").textContent = "Bergabung sejak —";
  }
  document.getElementById("btnLogout").addEventListener("click", function() {
    if (confirm("Yakin mau keluar dari akun?")) {
      localStorage.removeItem("anabulku_user_session");
      localStorage.removeItem("anabulku_user_remember");
      window.location.replace("home.html");
    }
  });
})();
</script>
</body>
</html>
