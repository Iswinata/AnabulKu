<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FCECE3" />
  <title>AnabulKu — Selamat Datang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="welcome.css" />
</head>
<body>
  <main class="welcome">

    <!-- ===== Decorative pastel pillars + pet avatars ===== -->
    <div class="pillars" aria-hidden="true">
      <span class="pillar p1"></span>
      <span class="pillar p2"></span>
      <span class="pillar p3"></span>
      <span class="pillar p4"></span>
      <span class="pillar p5"></span>

      <span class="pet pet-a"></span>
      <span class="pet pet-b"></span>
      <span class="pet pet-e"></span>
      <span class="pet pet-c"></span>
      <span class="pet pet-d"></span>
    </div>

    <!-- ===== Foreground content (fills lower area, no scroll) ===== -->
    <div class="content">
      <!-- ===== Heading + subtext + pagination dots ===== -->
      <section class="intro">
        <h1 class="intro-title">Perawatan Terbaik untuk Sahabat Berbulu</h1>
        <div class="intro-sub-wrap">
          <p class="intro-sub">Rawat kesehatan hewan kesayangan dengan mudah bersama layanan klinik yang terpercaya.</p>
        </div>
        <div class="intro-dots" role="tablist" aria-label="Slide">
          <span class="d active" role="tab" aria-selected="true" aria-label="Slide 1"></span>
          <span class="d" role="tab" aria-label="Slide 2"></span>
          <span class="d" role="tab" aria-label="Slide 3"></span>
        </div>
      </section>

      <!-- ===== Primary CTA ===== -->
      <a class="cta" href="home.html">Buat Akun</a>

      <!-- ===== Login link ===== -->
      <div class="login">
        <p>Sudah punya akun ? <a href="home.html">Log in</a></p>
      </div>
    </div>

  </main>
</body>
</html>
